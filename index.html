 prepara il ragù magro (se il macinato è surgelato, scongelalo prima in frigo): cuoce a lungo e il giorno dopo è più saporito. Con l'alternativa vegana vale lo stesso per il ragù di soia.","Cena: scongela il merluzzo in frigo.","Se corri: tieni pronti pane, miele e banana da aggiungere alla colazione."]}],recipes:[{n:1,title:"Overnight oats «tiramisù»",tag:"Vegetariana",when:"Colazione del martedì",portions:"1 porzione",time:"5 minuti + una notte in frigo",foods:[{q:"70 g",n:"fiocchi d'avena",h:""},{q:"200 g",n:"Skyr naturale",h:""},{q:"120 ml",n:"latte scremato",h:""},{q:"5 g",n:"cacao amaro in polvere",h:"1 cucchiaino"},{q:"10 g",n:"miele",h:"1 cucchiaino abbondante"},{q:"10 g",n:"noci",h:"≈2 noci"}],dose:"",extra:"1 tazzina di caffè espresso freddo, un pizzico di cannella (facoltativo)",steps:["In un barattolo mescola l'avena con il latte e il caffè freddo; lascia assorbire 5 minuti.","A parte lavora lo skyr con il miele finché diventa una crema liscia.","Alterna gli strati: avena al caffè, crema di skyr, di nuovo avena e infine skyr.","Chiudi e lascia in frigo tutta la notte (almeno 6 ore).","Al mattino spolvera con il cacao amaro e completa con le noci tritate grossolanamente."],tip:"Il caffè della ricetta conta tra le 2-3 tazzine della giornata. Versione vegana: yogurt e latte di soia (proteine più basse, vedi le regole).",k:526,p:38,c:65,g:13,items:[["avena",70],["skyr",200],["latte",120],["cacao",5],["miele",10],["noci",10]],prep:"prepara gli overnight oats (passaggi 1-4) e lasciali in frigo tutta la notte: al mattino aggiungi solo cacao e noci."},{n:2,title:"Pancake di avena e albumi ai frutti di bosco",tag:"Vegetariana",when:"Colazione del sabato",portions:"1 porzione (circa 6 pancake)",time:"15 minuti",foods:[{q:"60 g",n:"fiocchi d'avena",h:""},{q:"250 g",n:"albume d'uovo",h:"≈7-8 albumi"},{q:"100 g",n:"yogurt greco 0%",h:""},{q:"100 g",n:"frutti di bosco",h:""},{q:"10 g",n:"crema 100% arachidi",h:"1 cucchiaino abbondante"}],dose:"",extra:"1 cucchiaino di  con un cucchiaio di acqua di cottura."],tip:"Prepara una dose tripla e congelala in porzioni: dura 3 mesi. Ottima anche per lasagne o peperoni ripieni. Usa pasta di semola: quella all'uovo non è vegana.",k:593,p:43,c:76,g:13,items:[["pasta",70],["soia_text",60],["passata",200],["verdure",150],["olio",10]],prep:"prepara il ragù di soia (passaggi 1-4): il giorno dopo è più saporito e ti resta da cuocere solo la pasta."},{n:4,title:"Straccetti di seitan al limone e rosmarino con patate al forno",tag:"Vegana",when:"Cena del giovedì, alternativa vegana",portions:"1 porzione",time:"40 minuti (patate comprese)",foods:[{q:"200 g",n:"seitan",h:""},{q:"280 g",n:"patate",h:""},{q:"150 g",n:"insalata mista",h:""},{q:"15 g",n:"olio extravergine d'oliva",h:"1 cucchiaio e ½"}],dose:"",extra:"1 limone (succo e scorza grattugiata), 2 rametti di rosmarino, 1 spicchio d'aglio, 1 cucchiaino di amido di mais, pepe",steps:["Taglia le patate a spicchi, condiscile con 5 g d'olio, rosmarino e un pizzico di sale; cuocile in forno ventilato a 200°C per 35 minuti, girandole a metà.","Taglia il seitan a straccetti sottili.","In una padella antiaderente scalda 5 g d'olio con l'aglio schiacciato, aggiungi il seitan e rosolalo 4-5 minuti finché è dorato.","Sciogli l'amido nel succo di limone con 3 cucchiai d'acqua, versalo in padella e lascia addensare 1 minuto: si forma una cremina lucida.","Completa con scorza di limone, rosmarino tritato e pepe; servi con le patate e la rucola condita con i restanti 5 g d'olio."],tip:"Il seitan è già cotto: non prolungare la cottura o diventa gommoso.",k:630,p:54,c:60,g:20,items:[["seitan",200],["patate",280],["insalata",150],["olio",15]]},{n:5,title:"Tofu croccante al forno con riso integrale e verdure saltate",tag:"Vegana",when:"Pranzo del venerdì",portions:"1 porzione",time:"40 minuti (ottimo da preparare la sera prima)",foods:[{q:"230 g",n:"tofu naturale",h:""},{q:"60 g",n:"riso integrale",h:""},{q:"200 g",n:"verdure miste",h:""},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"}],dose:"",extra:"1 cucchiaio di salsa di soia, 1 cm di zenzero fresco grattugiato, 1 spicchio d'aglio, 1 cucchiaino di amido di mais, succo di mezzo lime o limone",steps:["Asciuga il tofu e pressalo 15 minuti tra fogli di carta da cucina con un peso sopra (un tagliere con un barattolo).","Taglialo a cubetti e marinalo 15 minuti con salsa di soia, zenzero e aglio.","Sgocciolalo, passalo nell'amido e cuocilo su carta forno in forno ventilato a 200°C per 25 minuti, girandolo a metà, finché è dorato e croccante.","Intanto cuoci il riso integrale (circa 40 minuti, oppure usa quello precotto).","Salta le verdure (peperoni, zucchine, carote, broccoli) in padella con l'olio per 3-4 minuti, restando croccanti; unisci la marinata avanzata e il lime, poi componi il piatto."],tip:"Il tofu croccante si conserva 3 giorni in frigo ed è ottimo anche freddo, nelle insalate.",k:598,p:39,c:56,g:24,items:[["tofu",230],["riso_int",60],["verdure",200],["olio",5]],prep:"pressa il tofu e mettilo a marinare in frigo con soia, zenzero e aglio (passaggi 1-2): più marina, più è saporito."},{n:6,title:"Burger di lenticchie e soia con spinaci",tag:"Vegana",when:"Cena del venerdì, alternativa vegana",portions:"2 burger (1 porzione)",time:"40 minuti",foods:[{q:"150 g",n:"lenticchie lessate",h:""},{q:"40 g",n:"soia texturizzata (granulare, secca)",h:""},{q:"20 g",n:"fiocchi d'avena",h:""},{q:"5 g",n:"semi di lino macinati",h:"1 cucchiaino"},{q:"200 g",n:"spinaci",h:""},{q:"40 g",n:"pane integrale",h:"1 fetta grande"},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"½ cipolla, 1 cucchiaino di paprika affumicata, ½ cucchiaino di cumino, prezzemolo, 1 cucchiaino di senape, brodo vegetale caldo, aglio",steps:["Idrata la soia in brodo caldo per 10 minuti e strizzala. Mescola il lino macinato con 3 cucchiai d'acqua e lascialo 5 minuti: diventa gelatinoso e fa da legante.","Frulla grossolanamente le lenticchie ben scolate con cipolla, spezie, senape e prezzemolo.","Unisci soia, avena e lino e impasta; se è troppo morbido aggiungi un cucchiaio di avena. Forma 2 burger e mettili 20 minuti in frigo.","Spennellali con 5 g d'olio e cuocili in forno a 200°C per 20-25 minuti, girandoli a metà (oppure in padella antiaderente, 4 minuti per lato).","Salta gli spinaci con l'aglio e i restanti 5 g d'olio; servi con il pane integrale tostato."],tip:"Si congelano crudi, separati da carta forno: pronti per le serate di fretta.",k:564,p:45,c:59,g:17,items:[["lenticchie",150],["soia_text",40],["avena",20],["lino",5],["spinaci",200],["pane_int",40],["olio",10]]},{n:7,title:"Salmone in crosta di noci ed erbe con patate e broccoli",tag:"Pesce",when:"Cena del lunedì",portions:"1 porzione",time:"40 minuti (patate comprese)",foods:[{q:"160 g",n:"salmone fresco",h:""},{q:"10 g",n:"noci",h:"≈2 noci"},{q:"250 g",n:"patate",h:""},{q:"250 g",n:"broccoli",h:""},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"}],dose:"",extra:"1 cucchiaino di senape, prezzemolo e aneto (o erba cipollina), scorza di mezzo limone, pepe",steps:["Taglia le patate a spicchi, condiscile con l'olio e cuocile in forno ventilato a 200°C per 35 minuti.","Trita finemente noci, erbe e scorza di limone.","Spennella la parte superiore del salmone con la senape e premi sopra la crosta di noci.","Negli ultimi 12-14 minuti metti il salmone nel forno insieme alle patate: il cuore deve restare rosato.","Cuoci i broccoli al vapore per 6-7 minuti e condiscili con succo di limone."],tip:"Le noci sostituiscono parte dell'olio: stessi grassi, ma con omega-3 vegetali in più.",k:700,p:46,c:52,g:34,items:[["salmone",160],["noci",10],["patate",250],["broccoli",250],["olio",5]],thaw:"se il salmone è surgelato, spostalo dal freezer al frigo.",thawL:"se il salmone è surgelato, scongelalo prima"},{n:8,title:"Pollo al curry e yogurt con riso basmati e zucchine",tag:"Carne",when:"Pranzo del martedì",portions:"1 porzione",time:"25 minuti + marinatura",foods:[{q:"160 g",n:"petto di pollo",h:""},{q:"50 g",n:"yogurt greco 0%",h:"2 cucchiai, per la marinatura"},{q:"80 g",n:"riso basmati",h:""},{q:"200 g",n:"zucchine",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"1 cucchiaino di curry, ½ cucchiaino di curcuma, 1 cm di zenzero, 1 spicchio d'aglio, succo di mezzo limone, prezzemolo o coriandolo",steps:["Taglia il pollo a bocconcini e marinalo con yogurt, spezie, aglio, zenzero e limone per almeno 30 minuti (meglio la sera prima).","Cuoci il riso basmati in acqua salata (10-12 minuti).","In una padella scalda l'olio e cuoci le zucchine a rondelle per 5 minuti.","Aggiungi il pollo con tutta la marinata e cuoci a fuoco medio 8-10 minuti, mescolando e aggiungendo un goccio d'acqua se serve, finché la salsa è cremosa.","Completa con prezzemolo o coriandolo e servi con il riso."],tip:"Lo yogurt rende il pollo morbidissimo. Versione vegana: seitan a bocconcini e yogurt di soia, stessi tempi.",k:593,p:50,c:68,g:13,items:[["pollo",160],["yogurt",50],["riso",80],["zucchine",200],["olio",10]],prep:"metti il pollo a bocconcini a marinare in frigo con yogurt, spezie, aglio, zenzero e limone (passaggio 1).",thaw:"se il pollo è surgelato, spostalo dal freezer al frigo.",thawL:"se il pollo è surgelato, scongelalo prima"},{n:9,title:"Nice cream ai frutti di bosco",tag:"Vegetariana",when:"Spuntino serale del sabato",portions:"1 porzione",time:"5 minuti",foods:[{q:"170 g",n:"yogurt greco 0%",h:""},{q:"100 g",n:"frutti di bosco",h:""}],dose:"",extra:"qualche goccia di vaniglia, foglie di menta; facoltativi 100 g di banana congelata a rondelle (+90 kcal) nei giorni di pesi",steps:["Tieni i frutti di bosco in freezer (vanno bene quelli surgelati).","Frullali ancora congelati con lo yogurt greco e la vaniglia, a scatti, raschiando le pareti del frullatore.","Servi subito come un gelato soft, oppure metti 20 minuti in freezer per una consistenza più compatta."],tip:"Con la banana congelata diventa ancora più cremosa: in quel caso usala come spuntino pre-allenamento. Versione vegana: yogurt di soia.",k:134,p:18,c:14,g:1,items:[["yogurt",170],["bosco",100]]},{n:10,title:"Hummus leggero con gallette e verdure croccanti",tag:"Vegana",when:"Spuntino alternativo: sostituisce uno spuntino da 200-250 kcal",portions:"1 porzione",time:"10 minuti",foods:[{q:"100 g",n:"ceci lessati",h:""},{q:"10 g",n:"tahina (crema di sesamo)",h:""},{q:"10 g",n:"gallette di riso integrale",h:""},{q:"150 g",n:"verdure miste",h:""}],dose:"",extra:"succo di mezzo limone, ½ spicchio d'aglio, cumino, paprika, 2-3 cucchiai di acqua fredda; verdure da intingere: carote, sedano, finocchi, peperoni",steps:["Sciacqua i ceci e frullali con tahina, limone, aglio e cumino.","Aggiungi l'acqua fredda un cucchiaio alla volta fino a una crema liscia e spumosa.","Spolvera con paprika e servi con le gallette e le verdure tagliate a bastoncini."],tip:"Ha meno proteine (≈13 g) di uno spuntino con skyr: se lo usi, aggiungi 60 g di lupini o 50 g di tofu in un altro pasto.",k:247,p:12,c:31,g:8,items:[["ceci",100],["tahina",10],["gallette",10],["verdure",150]],prep:"se lo mangi fuori casa, frulla l'hummus stasera e tienilo in frigo (dura 4-5 giorni); verdure e gallette a parte."}]},f2:{label:"Mantenimento",desc:"Fase 2: calorie di mantenimento, più flessibilità",days:[{name:"Lunedì",short:"Lun",type:"pesi",typeLabel:"Giornata pesi",session:"Upper",mod:null,base:{k:2522,p:168,c:282,g:80},full:{k:2522,p:168,c:282,g:80},veg:{k:2558,p:136,c:287,g:96},meals:[{name:"Colazione",time:"7:00",title:"Skyr con granola croccante e fragole",foods:[{q:"200 g",n:"Skyr naturale",h:""},{q:"50 g",n:"fiocchi d'avena",h:""},{q:"10 g",n:"noci",h:"≈2 noci"},{q:"10 g",n:"miele",h:"1 cucchiaino abbondante"},{q:"10 g",n:"albume d'uovo",h:""},{q:"200 g",n:"fragole",h:""},{q:"10 g",n:"semi di lino macinati",h:"1 cucchiaio"}],note:"Granola: ricetta n. 1 (si prepara una volta per 5 colazioni).",mod:null,k:508,p:34,c:58,g:15,alt:{tipo:"Vegana",title:"Yogurt di soia con granola vegana e fragole",foods:[{q:"250 g",n:"yogurt di soia bianco senza zuccheri",h:""},{q:"50 g",n:"fiocchi d'avena",h:""},{q:"10 g",n:"noci",h:"≈2 noci"},{q:"10 g",n:"sciroppo d'acero",h:"1 cucchiaino abbondante"},{q:"150 g",n:"fragole",h:""},{q:"10 g",n:"semi di lino macinati",h:"1 cucchiaio"}],note:"Granola con sciroppo d'acero al posto di miele e albume.",k:463,p:21,c:49,g:20,items:[["yogurt_soia",250],["avena",50],["noci",10],["acero",10],["fragole",150],["lino",10]],steps:["Granola vegana: prepara la ricetta n. 1 sostituendo miele e albume con lo sciroppo d'acero e aggiungendo i semi di lino; si conserva 2 settimane.","Versa lo yogurt di soia in una ciotola.","Completa con la granola e le fragole a pezzi."],ref:1},items:[["skyr",200],["avena",50],["noci",10],["miele",10],["albume",10],["fragole",200],["lino",10]],steps:["Versa lo skyr in una ciotola.","Taglia le fragole a pezzi.","Completa con 50 g di granola (ricetta n. 1, preparata in anticipo) e le fragole."],ref:1},{name:"Spuntino",time:"10:30",title:"Mela e mandorle",foods:[{q:"150 g",n:"mela",h:"1 media"},{q:"25 g",n:"mandorle",h:"≈20 mandorle"}],note:"",mod:null,k:220,p:6,c:20,g:13,items:[["mela",150],["mandorle",25]],steps:["Lava la mela e tagliala a spicchi.","Mangiala con le mandorle."]},{name:"Pranzo",time:"13:00",title:"Cous cous integrale con pollo, ceci, verdure e menta",foods:[{q:"100 g",n:"cous cous integrale",h:""},{q:"130 g",n:"petto di pollo",h:""},{q:"100 g",n:"ceci lessati",h:""},{q:"100 g",n:"peperoni",h:""},{q:"100 g",n:"zucchine",h:""},{q:"100 g",n:"pomodori/pomodorini",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],note:"Cous cous idratato in acqua bollente salata (5 min), poi sgranato con la forchetta. Menta, limone e cumino.",mod:null,k:720,p:53,c:89,g:17,alt:{tipo:"Vegana",title:"Cous cous con ceci, tofu speziato e verdure",foods:[{q:"100 g",n:"cous cous integrale",h:""},{q:"150 g",n:"tofu naturale",h:""},{q:"100 g",n:"ceci lessati",h:""},{q:"100 g",n:"peperoni",h:""},{q:"100 g",n:  tipica.","Lascia riposare 5 minuti coperta con un canovaccio; servi con spicchi di limone e prezzemolo."]},{name:"Spuntino",time:"17:00",title:"Yogurt greco, miele e noci",foods:[{q:"170 g",n:"yogurt greco 0%",h:""},{q:"10 g",n:"miele",h:"1 cucchiaino abbondante"},{q:"20 g",n:"noci",h:"≈4 noci"}],note:"",mod:null,k:262,p:20,c:15,g:13,alt:{tipo:"Vegana",title:"Yogurt di soia, noci e lupini",foods:[{q:"170 g",n:"yogurt di soia bianco senza zuccheri",h:""},{q:"10 g",n:"sciroppo d'acero",h:"1 cucchiaino abbondante"},{q:"20 g",n:"noci",h:"≈4 noci"},{q:"60 g",n:"lupini pronti (sciacquati)",h:""}],note:"",k:302,p:19,c:14,g:19,items:[["yogurt_soia",170],["acero",10],["noci",20],["lupini",60]],steps:["Versa lo yogurt di soia in una ciotola con lo sciroppo d'acero e le noci.","Sciacqua i lupini e mangiali a parte."]},items:[["yogurt",170],["miele",10],["noci",20]],steps:["Versa lo yogurt in una ciotola.","Completa con il miele a filo e le noci spezzettate."]},{name:"Cena",time:"20:00",title:"Nasello gratinato alle erbe con finocchi al forno e pane",foods:[{q:"220 g",n:"merluzzo/nasello",h:""},{q:"40 g",n:"pane integrale",h:"1 fetta grande"},{q:"5 g",n:"Parmigiano Reggiano",h:"1 cucchiaino grattugiato"},{q:"300 g",n:"finocchi",h:""},{q:"200 g",n:"patate",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],note:"Panatura con 10 g del pane frullato, prezzemolo, scorza di limone e Parmigiano; forno a 200°C per 15 minuti.",mod:null,k:590,p:52,c:62,g:15,alt:{tipo:"Vegana",title:"Vellutata di lenticchie rosse e carote con tofu croccante e crostini",foods:[{q:"200 g",n:"lenticchie lessate",h:""},{q:"100 g",n:"carote",h:""},{q:"100 g",n:"tofu naturale",h:""},{q:"60 g",n:"pane integrale",h:"2 fette"},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],note:"",k:569,p:36,c:60,g:20,items:[["lenticchie",200],["carote",100],["tofu",100],["pane_int",60],["olio",10]],steps:["Soffriggi mezza cipolla e le carote a rondelle con metà dell'olio per 5 minuti.","Aggiungi le lenticchie e brodo o acqua fino a coprire; cuoci 15 minuti e frulla fino a una crema.","Rosola il tofu a cubetti in padella con il resto dell'olio finché è croccante.","Tosta il pane a crostini.","Servi la vellutata con tofu, crostini e un pizzico di pepe o curcuma."]},items:[["merluzzo",220],["pane_int",40],["parmigiano",5],["finocchi",300],["patate",200],["olio",10]],steps:["Scalda il forno a 200°C: taglia finocchi e patate a fette, condiscili con metà dell'olio e cuocili 25 minuti.","Frulla 10 g di pane con prezzemolo, scorza di limone e Parmigiano.","Disponi il nasello scongelato su carta forno, spennellalo con il resto dell'olio e coprilo con la panatura.","Infornalo con le verdure per gli ultimi 15 minuti, finché la crosta è dorata.","Servi con il pane rimasto."]}],prep:["Pranzo: se il pollo per la paella è surgelato, spostalo dal freezer al frigo.","Cena: scongela il nasello in frigo.","Se corri: tieni pronti pane, miele e banana per la colazione e gli ingredienti del frullato di recupero."]}],recipes:[{n:1,title:"Granola croccante senza olio",tag:"Vegetariana",when:"Colazione del lunedì",portions:"dose per 5 porzioni",time:"30 minuti",foods:[{q:"50 g",n:"fiocchi d'avena",h:""},{q:"10 g",n:"noci",h:"≈2 noci"},{q:"10 g",n:"miele",h:"1 cucchiaino abbondante"},{q:"10 g",n:"albume d'uovo",h:""}],dose:"5 porzioni: 250 g di fiocchi d'avena, 50 g di noci, 50 g di miele, 1 albume (≈50 g)",extra:"1 cucchiaino di cannella, un pizzico di sale, scorza d'arancia grattugiata (facoltativa)",steps:["Scalda il forno statico a 160°C e rivesti una teglia con carta forno.","In una ciotola mescola avena, noci tritate grossolanamente, cannella, sale e scorza d'arancia.","Sbatti leggermente l'albume con il miele e versalo sugli ingredienti secchi: mescola finché tutto è lucido e forma piccoli grumi.","Stendi in uno strato sottile e cuoci 20-25 minuti, girando delicatamente a metà, finché è dorata.","Lasciala raffreddare nella teglia senza toccarla: diventa croccante raffreddando. Si conserva 2 settimane in un barattolo chiuso."],tip:"Versione vegana: sciroppo d'acero al posto del miele e 1 cucchiaio d'acqua al posto dell'albume (fa meno «cluster», ma è ugualmente croccante).",k:282,p:9,c:39,g:10,items:[["avena",50],["noci",10],["miele",10],["albume",10]],prep:"se la granola è finita, preparane una dose intera: deve raffreddarsi nella teglia per diventare croccante e dura 2 settimane."},{n:2,title:"Porridge «apple pie» con yogurt e noci",tag:"Vegetariana",when:"Colazione del martedì",portions:"1 porzione",time:"10 minuti",foods:[{q:"70 g",n:"fiocchi d'avena",h:""},{q:"250 ml",n:"latte scremato",h:""},{q:"150 g",n:"mela",h:"1 media"},{q:"120 g",n:"yogurt greco 0%",h:""},{q:"15 g",n:"noci",h:"≈3 noci"}],dose:"",extra:"1 cucchiaino di cannella, un pizzico di noce moscata e di sale, qualche goccia di vaniglia",steps:["Taglia la mela a cubetti e cuocila in un pentolino con 2 cucchiai d'acqua e metà della cannella per 3-4 minuti, finché si ammorbidisce.","Aggiungi avena, latte, sale, noce moscata e il resto della cannella; cuoci a fuoco medio 4-5 minuti mescolando.","Togli dal fuoco, lascia intiepidire un minuto e incorpora metà dello yogurt con la vaniglia: diventa cremosissimo.","Servi con il resto dello yogurt e le noci tostate 2 minuti in padella: il profumo è quello di una torta di mele."],tip:"Con le pere e lo zenzero al posto di mela e cannella diventa un'ottima variante invernale.",k:582,p:33,c:78,g:16,items:[["avena",70],["latte",250],["mela",150],["yogurt",120],["noci",15]]},{n:3,title:"Muffin di avena e mirtilli",tag:"Vegetariana",when:"Colazione del giovedì",portions:"6 muffin (3 porzioni da 2)",time:"35 minuti",foods:[{q:"50 g",n:"fiocchi d'avena",h:""},{q:"60 g",n:"yogurt greco 0%",h:""},{q:"60 g",n:"albume d'uovo",h:"2 albumi"},{q:"50 g",n:"banana",h:"½ banana"},{q:"40 g",n:"frutti di bosco",h:""}],dose:"6 muffin: 150 g di fiocchi d'avena, 180 g di yogurt greco 0%, 180 g di albumi (≈5-6), 150 g di banana matura, 120 g di mirtilli",extra:"8 g di lievito per dolci, 1 cucchiaino di cannella, vaniglia, un pizzico di sale",steps:["Scalda il forno a 180°C e prepara 6 pirottini di carta o silicone.","Frulla l'avena fino a ottenere una farina; unisci lievito, cannella e sale.","In un'altra ciotola schiaccia la banana con la forchetta e mescola con yogurt, albumi e vaniglia.","Unisci i due composti senza lavorare troppo, poi incorpora i mirtilli (se surgelati, passali prima in un cucchiaio di farina d'avena perché non affondino).","Riempi i pirottini e cuoci 22-25 minuti: sono pronti quando uno stecchino esce asciutto. Durano 4 giorni in frigo, o si congelano."],tip:"Scaldati 20 secondi al microonde tornano morbidi come appena sfornati. La banana matura sostituisce lo zucchero.",k:300,p:20,c:46,g:4,items:[["avena",50],["yogurt",60],["albume",60],["banana",50],["bosco",40]],prep:"controlla che siano rimasti 2 muffin; se sono finiti, preparane una dose (durano 4 giorni in frigo)."},{n:4,title:"French toast integrale con frutti di bosco",tag:"Vegetariana",when:"Colazione del sabato",portions:"1 porzione",time:"15 minuti",foods:[{q:"80 g",n:"pane integrale",h:"2-3 fette"},{q:"60 g",n:"uovo intero",h:"1 uovo medio"},{q:"120 g",n:"albume d'uovo",h:"≈4 albumi"},{q:"50 ml",n:"latte scremato",h:""},{q:"150 g",n:"frutti di bosco",h:""},{q:"150 g",n:"yogurt greco 0%",h:""},{q:"10 g",n:"miele",h:"1 cucchiaino abbondante"},{q:"15 g",n:"noci",h:"≈3 noci"}],dose:"",extra:"1 cucchiaino di cannella, vaniglia, scorza d'arancia",steps:["Sbatti uovo, albumi, latte, cannella, vaniglia e scorza d'arancia in un piatto fondo.","Immergi le fette di pane 20 secondi per lato, finché si imbevono senza sfaldarsi.","Cuocile in una padella antiaderente appena unta a fuoco medio, 2-3 minuti per lato, finché sono dorate.","Intanto scalda i frutti di bosco in un pentolino per 2 minuti: diventano una salsa.","Servi con la salsa di frutti di bosco, lo yogurt, il miele e le noci tritate."],tip:"Il pane del giorno prima si imbeve meglio. Versione vegana: latte di soia e 30 g di farina di ceci al posto di uovo e albumi.",k:617,p:48,c:64,g:19,items:[["pane_int",80],["uovo",60],["albume",120],["latte",50],["bosco",150],["yogurt",150],["miele",10],["noci",15]]},{n:5,title:"Burrito bowl con pollo, fagioli, mais e avocado",tag:"Carne",when:"Pranzo del mercoledì",portions:"1 porzione",time:"30 minuti (ottima da portare al lavoro)",foods:[{q:"70 g",n:"riso integrale",h:""},{q:"140 g",n:"petto di pollo",h:""},{q:"150 g",n:"fagioli lessati",h:""},{q:"50 g",n:"mais dolce (sgocciolato)",h:""},{q:"100 g",n:"peperoni",h:""},{q:"100 g",n:"pomodori/pomodorini",h:""},{q:"40 g",n:"avocado",h:"¼ scarso di avocado"},{q:"30 g",n:"yogurt greco 0%",h:"1 cucchiaio abbondante"},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"}],dose:"",extra:"paprika affumicata, cumino, origano, 1 lime, coriandolo o prezzemolo, ¼ di cipolla rossa, peperoncino a piacere",steps:["Cuoci il riso integrale (o usa quello precotto).","Taglia il pollo a striscioline, condiscilo con paprika, cumino, origano e succo di mezzo lime; cuocilo in padella con l'olio per 6-8 minuti.","Prepara il pico de gallo: pomodori e cipolla rossa a dadini, coriandolo, lime e un pizzico di sale.","Scalda i fagioli con un pizzico di cumino e salta i peperoni a listarelle per 3-4 minuti.","Componi la bowl a spicchi: riso, pollo, fagioli, mais, peperoni, pico de gallo, avocado a fette e lo yogurt mescolato con lime (la «sour cream» leggera)."],tip:"Da portare al lavoro: tieni avocado e yogurt a parte e aggiungili al momento. Versione vegana: 200 g di tofu sbriciolato con le stesse spezie.",k:730,p:56,c:89,g:17,items:[["riso_int",70],["pollo",140],["fagioli",150],["mais",50],["peperoni",100],["pomodori",100],["avocado",40],["yogurt",30],["olio",5]],thaw:"se il pollo è surgelato, spostalo dal freezer al frigo.",thawL:"se il pollo è surgelato, scongelalo prima"},{n:6,title:"Polpette di tacchino e avena al sugo con purè leggero",tag:"Carne",when:"Cena del martedì",portions:"1 porzione (8-10 polpette)",time:"40 minuti",foods:[{q:"180 g",n:"fesa di tacchino",h:""},{q:"20 g",n:"fiocchi d'avena",h:""},{q:"30 g",n:"albume d'uovo",h:"1 albume"},{q:"150 g",n:"passata di pomodoro",h:""},{q:"250 g",n:"patate",h:""},{q:"60 ml",n:"latte scremato",h:""},{q:"150 g",n:"spinaci",h:""},{q:"15 g",n:"olio extravergine d'oliva",h:"1 cucchiaio e ½"}],dose:"",extra:"prezzemolo, 1 spicchio d'aglio, scorza di limone, noce moscata, basilico, sale e pepe",steps:["Frulla o fai macinare la fesa di tacchino; impastala con avena, albume, prezzemolo, scorza di limone, sale e pepe. Forma 8-10 polpette.","In una padella scalda 5 g d'olio con l'aglio, aggiungi la passata e il basilico e cuoci 10 minuti.","Adagia le polpette nel sugo, copri e cuoci a fuoco dolce 15-20 minuti, girandole a metà.","Lessa le patate, schiacciale e montale con il latte caldo, 5 g d'olio, noce moscata e sale: un purè senza burro.","Salta gli spinaci con i restanti 5 g d'olio e servi tutto insieme."],tip:"L'avena al posto del pangrattato lega l'impasto e porta beta-glucani. Versione vegana: lenticchie e soia texturizzata con lo stesso procedimento.",k:694,p:63,c:66,g:20,items:[["tacchino",180],["avena",20],["albume",30],["passata",150],["patate",250],["latte",60],["spinaci",150],["olio",15]],thaw:"se il tacchino è surgelato, spostalo dal freezer al frigo.",thawL:"se il tacchino è surgelato, scongelalo prima"},{n:7,title:"Fajitas di manzo con piadine integrali fatte in casa",tag:"Carne",when:"Cena del giovedì",portions:"1 porzione (2 piadine)",time:"35 minuti",foods:[{q:"160 g",n:"manzo magro (fesa/magatello)",h:""},{q:"200 g",n:"peperoni",h:""},{q:"70 g",n:"farina integrale",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"},{q:"60 g",n:"yogurt greco 0%",h:""},{q:"60 g",n:"avocado",h:"¼ abbondante di avocado"}],dose:"",extra:"½ cipolla, 1 lime, paprika, cumino, aglio in polvere, erba cipollina, un pizzico di bicarbonato, 40 ml di acqua tiepida, sale",steps:["Piadine: impasta farina, bicarbonato, sale, 5 g d'olio e l'acqua tiepida fino a un panetto liscio; lascia riposare 15 minuti coperto.","Taglia il manzo a striscioline e marinalo con paprika, cumino, aglio in polvere e succo di mezzo lime.","Dividi l'impasto in 2, stendilo sottile e cuoci ogni piadina in una padella rovente senza grassi, 1-2 minuti per lato.","Nella stessa padella salta peperoni e cipolla a listarelle con 5 g d'olio per 5-6 minuti, poi aggiungi il manzo per 2-3 minuti a fuoco vivace.","Prepara la salsa con yogurt, lime ed erba cipollina e componi le fajitas con carne, verdure, avocado e salsa."],tip:"La piadina tradizionale romagnola usa lo strutto: questa versione con olio extravergine ha una frazione dei grassi saturi. Versione vegana: seitan a straccetti.",k:659,p:52,c:55,g:26,items:[["manzo",160],["peperoni",200],["farina_int",70],["olio",10],["yogurt",60],["avocado",60]],prep:"taglia il manzo a striscioline e mettilo a marinare in frigo con paprika, cumino e aglio; il lime aggiungilo poco prima di cuocere, così la carne resta tenera.",thaw:"se il manzo è surgelato, spostalo dal freezer al frigo.",thawL:"se il manzo è surgelato, scongelalo prima"},{n:8,title:"Salmone teriyaki con riso basmati e broccoli",tag:"Pesce",when:"Cena del venerdì",portions:"1 porzione",time:"25 minuti",foods:[{q:"150 g",n:"salmone fresco",h:""},{q:"10 ml",n:"salsa di soia",h:"2 cucchiaini"},{q:"5 g",n:"miele",h:"1 cucchiaino raso"},{q:"60 g",n:"riso basmati",h:""},{q:"250 g",n:"broccoli",h:""},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"}],dose:"",extra:"1 cm di zenzero fresco, 1 spicchio d'aglio, 1 cucchiaino di amido di mais, 3 cucchiai d'acqua, succo di lime",steps:["Prepara la glassa: salsa di soia, miele, zenzero grattugiato, aglio schiacciato, acqua e amido sciolto.","Cuoci il riso basmati (10-12 minuti) e i broccoli al vapore (6-7 minuti).","In una padella antiaderente scalda l'olio e cuoci il salmone dal lato della pelle per 4 minuti, poi giralo per altri 2-3 minuti.","Versa la glassa e lasciala addensare 1 minuto, bagnando il salmone con un cucchiaio finché diventa lucido.","Servi con riso, broccoli e qualche goccia di lime."],tip:"Usa salsa di soia a ridotto contenuto di sale. Versione vegana: tofu a fette con sciroppo d'acero al posto del miele.",k:655,p:43,c:61,g:26,items:[["salmone",150],["salsa_soia",10],["miele",5],["riso",60],["broccoli",250],["olio",5]],thaw:"se il salmone è surgelato, spostalo dal freezer al frigo.",thawL:"se il salmone è surgelato, scongelalo prima"},{n:9,title:"Pizza integrale fatta in casa con verdure e mozzarella light",tag:"Vegetariana",when:"Cena del sabato",portions:"1 pizza",time:"20 minuti + lievitazione",foods:[{q:"110 g",n:"farina integrale",h:""},{q:"80 g",n:"passata di pomodoro",h:""},{q:"60 g",n:"mozzarella light",h:""},{q:"80 g",n:"zucchine",h:""},{q:"80 g",n:"melanzane",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"1 g di lievito di birra secco (o 3 g fresco), 75 ml di acqua, 2 g di sale, origano, basilico",steps:["Sciogli il lievito nell'acqua, aggiungi la farina e impasta; unisci sale e 5 g d'olio e lavora 8-10 minuti fino a un panetto liscio.","Lascia lievitare coperto 3-4 ore a temperatura ambiente, oppure 24 ore in frigo (più digeribile e saporita).","Griglia zucchine e melanzane a fette sottili. Stendi l'impasto su una teglia con carta forno, condisci con passata e origano.","Cuoci nel forno alla massima temperatura (250°C) per 8 minuti, poi aggiungi mozzarella e verdure e prosegui per altri 5-7 minuti.","All'uscita completa con il resto dell'olio a crudo e il basilico."],tip:"È la pizza «di piano»: la puoi mangiare anche senza usare un pasto libero. Versione vegana: tofu affumicato a cubetti al posto della mozzarella.",k:579,p:28,c:76,g:18,items:[["farina_int",110],["passata",80],["mozz_light",60],["zucchine",80],["melanzane",80],["olio",10]],prep:"prepara l'impasto (passaggio 1) e lascialo lievitare in frigo per 24 ore, coperto."},{n:10,title:"Paella di pollo, piselli e peperoni",tag:"Carne",when:"Pranzo della domenica",portions:"1 porzione",time:"40 minuti",foods:[{q:"90 g",n:"riso Carnaroli",h:""},{q:"140 g",n:"petto di pollo",h:""},{q:"100 g",n:"piselli (surgelati)",h:""},{q:"150 g",n:"peperoni",h:""},{q:"50 g",n:"passata di pomodoro",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"1 bustina di zafferano, 1 cucchiaino di paprika dolce, ½ cipolla, 1 spicchio d'aglio, 300 ml di brodo vegetale caldo, limone, prezzemolo",steps:["In una padella larga rosola il pollo a bocconcini con metà dell'olio per 5 minuti; tienilo da parte.","Nella stessa padella soffriggi cipolla, aglio e peperoni con l'olio rimasto per 5 minuti.","Aggiungi il riso e tostalo 1 minuto, poi paprika e passata.","Versa il brodo con lo zafferano sciolto, rimetti il pollo e aggiungi i piselli: cuoci 16-18 minuti a fuoco medio senza mescolare, così sul fondo si forma la crosticina tipica.","Lascia riposare 5 minuti coperta con un canovaccio; servi con spicchi di limone e prezzemolo."],tip:"Il Carnaroli tiene bene la cottura; va bene anche il riso specifico per paella. Versione vegana: ceci e tofu affumicato al posto del pollo.",k:662,p:46,c:89,g:14,items:[["riso_car",90],["pollo",140],["piselli",100],["peperoni",150],["passata",50],["olio",10]],thaw:"se il pollo è surgelato, spostalo dal freezer al frigo.",thawL:"se il pollo è surgelato, scongelalo prima"},{n:11,title:"Curry di ceci e spinaci con riso basmati e raita",tag:"Vegetariana",when:"Cena del mercoledì",portions:"1 porzione",time:"30 minuti",foods:[{q:"200 g",n:"ceci lessati",h:""},{q:"200 g",n:"spinaci",h:""},{q:"100 g",n:"passata di pomodoro",h:""},{q:"60 g",n:"riso basmati",h:""},{q:"150 g",n:"yogurt greco 0%",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"½ cipolla, 1 spicchio d'aglio, 1 cm di zenzero, 1 cucchiaino di garam masala, ½ di curcuma e ½ di cumino; per la raita: ½ cetriolo, menta, limone",steps:["Soffriggi cipolla, aglio e zenzero tritati nell'olio per 4 minuti; aggiungi le spezie e tostale 1 minuto.","Unisci passata, ceci e mezzo bicchiere d'acqua; cuoci 12-15 minuti finché il sugo si addensa.","Aggiungi gli spinaci e lasciali appassire 2-3 minuti. Intanto cuoci il riso basmati.","Raita: grattugia il cetriolo, strizzalo e mescolalo con lo yogurt, la menta tritata, il limone e un pizzico di sale.","Servi il curry con il riso e la raita fresca a parte."],tip:"Niente latte di cocco: è ricco di grassi saturi. La cremosità arriva dalla raita. Versione vegana: yogurt di soia e 100 g di tofu nel curry.",k:683,p:42,c:92,g:16,items:[["ceci",200],["spinaci",200],["passata",100],["riso",60],["yogurt",150],["olio",10]]},{n:12,title:"Energy balls al cacao e datteri",tag:"Vegana",when:"Pre-allenamento del lunedì",portions:"12 palline (6 porzioni da 2)",time:"15 minuti + 30 in frigo",foods:[{q:"30 g",n:"datteri secchi",h:"≈4 datteri"},{q:"15 g",n:"fiocchi d'avena",h:""},{q:"10 g",n:"mandorle",h:"≈8 mandorle"},{q:"5 g",n:"cacao amaro in polvere",h:"1 cucchiaino"}],dose:"12 palline: 180 g di datteri, 90 g di fiocchi d'avena, 60 g di mandorle, 30 g di cacao amaro",extra:"un pizzico di sale, 1-2 cucchiai d'acqua, cocco rapé o cacao per rotolarle (facoltativi)",steps:["Se i datteri sono molto secchi, ammollali 10 minuti in acqua calda e scolali.","Frulla mandorle e avena fino a ottenere una farina grossolana.","Aggiungi datteri, cacao e sale e frulla fino a una pasta compatta; se non si lega, un cucchiaio d'acqua alla volta.","Forma 12 palline con le mani leggermente umide e, a piacere, passale nel cacao.","Mettile in frigo 30 minuti. Si conservano una settimana in frigo o 2 mesi in freezer."],tip:"Due palline 60-90 minuti prima della palestra danno energia facile da digerire. Sono già vegane.",k:205,p:6,c:30,g:7,items:[["datteri",30],["avena",15],["mandorle",10],["cacao",5]],prep:"se le energy balls sono finite, preparane una dose (12 palline): devono stare almeno 30 minuti in frigo e durano una settimana."}]},extra:[{n:"E1",num:1,title:"Omelette dolce di albumi e avena alla cannella",tag:"Vegetariana",slot:"Colazione",when:"Colazione",portions:"1 porzione",time:"10 minuti",foods:[{q:"50 g",n:"fiocchi d'avena",h:""},{q:"200 g",n:"albume d'uovo",h:"≈6 albumi"},{q:"100 g",n:"banana",h:"1 piccola, sbucciata"},{q:"100 g",n:"yogurt greco 0%",h:""},{q:"10 g",n:"noci",h:"≈2 noci"}],dose:"",extra:"1 cucchiaino di cannella, vaniglia, un pizzico di sale",steps:["Frulla avena, albumi, metà banana, cannella e vaniglia fino a un composto liscio.","Versalo in una padella antiaderente calda appena unta e cuoci a fuoco medio-basso con il coperchio per 4-5 minuti.","Quando la superficie è rappresa, piega l'omelette a metà.","Servi con lo yogurt, il resto della banana a rondelle e le noci tritate."],tip:"Il coperchio è il segreto: cuoce anche la parte sopra senza doverla girare.",k:485,p:41,c:56,g:11,items:[["avena",50],["albume",200],["banana",100],["yogurt",100],["noci",10]],new:!1},{n:"E2",num:2,title:"Porridge proteico al cacao e banana",tag:"Vegetariana",slot:"Colazione",when:"Colazione",portions:"1 porzione",time:"8 minuti",foods:[{q:"60 g",n:"fiocchi d'avena",h:""},{q:"250 ml",n:"latte scremato",h:""},{q:"150 g",n:"Skyr naturale",h:""},{q:"5 g",n:"cacao amaro in polvere",h:"1 cucchiaino"},{q:"100 g",n:"banana",h:"1 piccola, sbucciata"},{q:"10 g",n:"crema 100% arachidi",h:"1 cucchiaino abbondante"}],dose:"",extra:"un pizzico di sale, cannella",steps:["Cuoci avena, latte, cacao e sale per 4-5 minuti mescolando.","Togli dal fuoco e incorpora lo skyr: diventa cremoso come un budino.","Completa con banana a rondelle e la crema di arachidi scaldata 10 secondi."],tip:"Con mezza banana schiacciata nella cottura diventa ancora più dolce senza zucchero.",k:553,p:38,c:76,g:11,items:[["avena",60],["latte",250],["skyr",150],["cacao",5],["banana",100],["arachidi_crema",10]],new:!1},{n:"E3",num:3,title:"Toast integrale con fiocchi di latte, fragole e miele",tag:"Vegetariana",slot:"Co ,n:"farina integrale",h:""},{q:"150 g",n:"albume d'uovo",h:""},{q:"50 ml",n:"latte scremato",h:""},{q:"150 g",n:"yogurt greco 0%",h:""},{q:"150 g",n:"kiwi",h:"2 kiwi"},{q:"10 g",n:"miele",h:"1 cucchiaino abbondante"},{q:"15 g",n:"mandorle",h:"≈12 mandorle"}],dose:"",extra:"vaniglia, un pizzico di sale",steps:["Sbatti albumi, farina, latte, vaniglia e sale fino a una pastella liscia.","In una padella antiaderente calda versa un mestolo per volta, ruotando per stenderla sottile.","Cuoci 1 minuto per lato: escono 3 crêpes.","Farciscile con yogurt e kiwi a cubetti e completa con il miele e le mandorle a lamelle."],tip:"Si possono preparare la sera prima e scaldare un minuto in padella.",k:463,p:42,c:53,g:10,items:[["farina_int",30],["albume",150],["latte",50],["yogurt",150],["kiwi",150],["miele",10],["mandorle",15]],new:!1},{n:"E6",num:6,title:"Bircher müesli con mela grattugiata",tag:"Vegetariana",slot:"Colazione",when:"Colazione",portions:"1 porzione",time:"5 minuti + una notte",foods:[{q:"60 g",n:"fiocchi d'avena",h:""},{q:"200 g",n:"yogurt greco 0%",h:""},{q:"100 ml",n:"latte scremato",h:""},{q:"150 g",n:"mela",h:"1 media"},{q:"15 g",n:"noci",h:"≈3 noci"},{q:"5 g",n:"semi di lino macinati",h:"1 cucchiaino"}],dose:"",extra:"succo di mezzo limone, cannella",steps:["Grattugia la mela con la buccia e condiscila subito con il limone.","Mescola avena, yogurt, latte, mela, lino e cannella.","Lascia in frigo tutta la notte e al mattino completa con le noci tritate."],tip:"È la colazione svizzera originale: fresca d'estate e pronta in un minuto la mattina.",k:561,p:35,c:67,g:17,items:[["avena",60],["yogurt",200],["latte",100],["mela",150],["noci",15],["lino",5]],new:!1,prep:"prepara il bircher (passaggi 1-2) e lascialo in frigo tutta la notte: al mattino aggiungi solo le noci."},{n:"E7",num:7,title:"Uova strapazzate con spinaci, pane integrale e arancia",tag:"Vegetariana",slot:"Colazione",when:"Colazione",portions:"1 porzione",time:"10 minuti",foods:[{q:"60 g",n:"uovo intero rette: 180 g di fiocchi d'avena, 60 g di crema di arachidi, 120 g di datteri, 120 ml di latte",extra:"cannella, un pizzico di sale",steps:["Frulla i datteri con il latte fino a una crema.","Mescola con avena, crema di arachidi, cannella e sale.","Pressa l'impasto in una teglia piccola rivestita di carta forno, alto circa 1,5 cm.","Cuoci 12 minuti a 180°C (oppure lascia crudo e metti in frigo 1 ora) e taglia in 6 barrette."],tip:"Ideali come pre-allenamento, 60-90 minuti prima della palestra. Si conservano 5 giorni in frigo.",k:229,p:8,c:33,g:7,items:[["avena",30],["arachidi_crema",10],["datteri",20],["latte",20]],new:!1,prep:"se le barrette sono finite, preparane una dose (6 barrette): devono rassodare almeno 1 ora in frigo e durano 5 giorni."},{n:"E10",num:10,title:"Hummus di lenticchie con carote e gallette",tag:"Vegana",slot:"Spuntino",when:"Spuntino",portions:"1 porzione",time:"10 minuti",foods:[{q:"120 g",n:"lenticchie lessate",h:""},{q:"5 g",n:"tahina (crema di sesamo)",h:"1 cucchiaino"},{q:"100 g",n:"carote",h:""},{q:"20 g",n:"gallette di riso integrale",h:"≈2 gallette"}],dose:"",extra:"succo di mezzo limone, cumino, paprika, mezzo spicchio d'aglio, 2 cucchiai d'acqua",steps:["Frulla lenticchie, tahina, limone, aglio, cumino e acqua fino a una crema liscia.","Spolvera di paprika.","Servi con carote a bastoncini e gallette."],tip:"Più veloce dell'hummus di ceci e più ricco di proteine.",k:246,p:13,c:39,g:4,items:[["lenticchie",120],["tahina",5],["carote",100],["gallette",20]],new:!1,prep:"se lo mangi fuori casa, frulla l'hummus stasera e tienilo in frigo; carote e gallette a parte."},{n:"E11",num:11,title:"Yogurt greco con granola in padella e pera",tag:"Vegetariana",slot:"Spuntino",when:"Spuntino",portions:"1 porzione",time:"5 minuti",foods:[{q:"170 g",n:"yogurt greco 0%",h:""},{q:"20 g",n:"fiocchi d'avena",h:""},{q:"5 g",n:"miele",h:"1 cucchiaino raso"},{q:"150 g",n:"pera",h:"1 media"}],dose:"",extra:"cannella",steps:["Tosta l'avena in padella antiaderente 2 urt, limone, capperi e pepe.","Spalmalo sul pane integrale tostato.","Completa con pomodorini a fettine e prezzemolo."],tip:"La mousse si conserva 2 giorni in frigo: ottima anche come condimento per insalate.",k:234,p:29,c:24,g:2,items:[["pane_int",50],["tonno",80],["yogurt",50],["pomodori",50]],new:!1,prep:"se lo mangi fuori casa, prepara la mousse di tonno stasera e tienila in frigo; il pane a parte, così non si inzuppa."},{n:"E17",num:17,title:"Rotolini di bresaola con fiocchi di latte e rucola",tag:"Carne",slot:"Spuntino",when:"Spuntino",portions:"1 porzione",time:"5 minuti",foods:[{q:"50 g",n:"bresaola",h:""},{q:"100 g",n:"fiocchi di latte light",h:""},{q:"30 g",n:"insalata mista",h:""},{q:"20 g",n:"gallette di riso integrale",h:"≈2 gallette"}],dose:"",extra:"succo di limone, pepe, erba cipollina",steps:["Condisci i fiocchi di latte con limone, pepe ed erba cipollina.","Stendi le fette di bresaola, mettici sopra un cucchiaio di fiocchi e qualche foglia di rucola.","Arrotola e servi con le gallette."],tip:"Molto proteico e con pochissimi grassi: ottimo come spuntino serale.",k:235,p:30,c:19,g:4,items:[["bresaola",50],["fiocchi",100],["insalata",30],["gallette",20]],new:!1},{n:"E18",num:18,title:"Insalata di orzo, salmone, zucchine e limone",tag:"Pesce",slot:"Pranzo o cena",when:"Pranzo o cena",portions:"1 porzione",time:"25 minuti",foods:[{q:"70 g",n:"orzo perlato",h:""},{q:"120 g",n:"salmone fresco",h:""},{q:"200 g",n:"zucchine",h:""},{q:"100 g",n:"pomodori/pomodorini",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"scorza e succo di limone, aneto o menta, pepe",steps:["Cuoci l'orzo in acqua salata (circa 20 minuti) e raffreddalo sotto l'acqua.","Cuoci il salmone in padella 3 minuti per lato e sbriciolalo a scaglie.","Taglia le zucchine a nastri sottili con il pelapatate e i pomodorini a metà.","Condisci tutto con olio, limone, erbe e pepe."],tip:"Si prepara la sera prima: il giorno dopo è ancora più saporita.",k:599,p:35,c:53,g:2 ole",h:""},{q:"5 g",n:"miele",h:"1 cucchiaino raso"}],dose:"",extra:"un pizzico di cardamomo, ghiaccio",steps:["Frulla tutto con il ghiaccio per 30 secondi.","Servi subito, spolverato di cardamomo."],tip:"Con la banana al posto delle fragole diventa un ottimo pre-allenamento.",items:[["yogurt",200],["latte",80],["fragole",150],["miele",5]],new:!0,k:199,p:24,c:24,g:1,n:"E78",num:78},{title:"Chana chaat, insalata di ceci speziata",paese:"India",tag:"Vegana",slot:"Spuntino",when:"Spuntino",portions:"1 porzione",time:"10 minuti",foods:[{q:"130 g",n:"ceci lessati",h:""},{q:"50 g",n:"edamame sgusciati (surgelati)",h:""},{q:"80 g",n:"pomodori/pomodorini",h:""},{q:"80 g",n:"cetriolo",h:""}],dose:"",extra:"cipolla rossa, coriandolo, lime, cumino tostato, peperoncino, chaat masala facoltativo",steps:["Sciacqua i ceci e mescolali con gli edamame scongelati, pomodori, cetriolo e cipolla a dadini.","Condisci con lime, cumino, sale, peperoncino e coriandolo."],tip:"Lo street food indiano più semplice: niente cottura e tante fibre.",items:[["ceci",130],["edamame",50],["pomodori",80],["cetriolo",80]],new:!0,k:232,p:17,c:28,g:6,n:"E79",num:79,prep:"metti gli edamame a scongelare in frigo."},{title:"Tempeh croccante al sesamo con carote",paese:"Indonesia",tag:"Vegana",slot:"Spuntino",when:"Spuntino",portions:"1 porzione",time:"20 minuti",foods:[{q:"80 g",n:"tempeh",h:""},{q:"5 g",n:"semi di sesamo",h:"1 cucchiaino"},{q:"5 ml",n:"salsa di soia",h:"1 cucchiaino"},{q:"150 g",n:"carote",h:""}],dose:"",extra:"aglio, coriandolo in polvere, un pizzico di zucchero di canna",steps:["Taglia il tempeh a bastoncini e sbollentalo 5 minuti.","Marinalo con soia, aglio e coriandolo, poi passalo nel sesamo.","Cuoci in forno a 200°C per 15 minuti girandolo a metà.","Servi con le carote a bastoncini."],tip:"Ispirato al tempe bacem giavanese, ma al forno invece che fritto.",items:[["tempeh",80],["sesamo",5],["salsa_soia",5],["carote",150]],new:!0,k:246,p:18,c:17,g:12,n:"E80",num:80,prep:"se lo mangi fuo na",tag:"Vegana",slot:"Pranzo o cena",when:"Pranzo o cena",portions:"1 porzione",time:"25 minuti",foods:[{q:"200 g",n:"tofu naturale",h:""},{q:"120 g",n:"funghi champignon",h:""},{q:"20 g",n:"soia texturizzata (granulare, secca)",h:""},{q:"60 g",n:"riso basmati",h:""},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"}],dose:"",extra:"aglio, zenzero, pepe di Sichuan, doubanjiang o pasta di peperoncino, 1 cucchiaino di amido, cipollotto",steps:["Idrata la soia in acqua calda e strizzala; trita i funghi.","Rosola aglio, zenzero, pasta di peperoncino, soia e funghi per 4 minuti.","Aggiungi 150 ml d'acqua e il tofu a cubi e cuoci 5 minuti; addensa con l'amido.","Completa con pepe di Sichuan e cipollotto e servi con il riso."],tip:"La versione originale usa carne di maiale: funghi e soia ne riproducono la consistenza.",items:[["tofu",200],["funghi",120],["soia_text",20],["riso",60],["olio",5]],new:!0,k:592,p:46,c:55,g:21,n:"E85",num:85},{title:"Tempe orek, tempeh glassato giavanese",paese:"Indonesia",tag:"Vegana",slot:"Pranzo o cena",when:"Pranzo o cena",portions:"1 porzione",time:"25 minuti",foods:[{q:"150 g",n:"tempeh",h:""},{q:"60 g",n:"riso basmati",h:""},{q:"150 g",n:"fagiolini",h:""},{q:"10 ml",n:"salsa di soia",h:""},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"}],dose:"",extra:"aglio, scalogno, peperoncino, galanga o zenzero, foglie di lime, 1 cucchiaino di zucchero di canna",steps:["Taglia il tempeh a bastoncini e sbollentalo 5 minuti.","Rosolalo in padella con l'olio finché è dorato.","Aggiungi aglio, scalogno, peperoncino, zenzero, soia e zucchero con 3 cucchiai d'acqua e glassa 3 minuti.","Servi con il riso e i fagiolini al vapore."],tip:"Nella versione originale il tempeh è fritto: in padella con poco olio resta croccante uguale.",items:[["tempeh",150],["riso",60],["fagiolini",150],["salsa_soia",10],["olio",5]],new:!0,k:599,p:37,c:63,g:22,n:"E86",num:86},{title:"Gado-gado, insalata indonesiana con salsa di arachidi",paese:"Indonesia",tag:"Vege escola lo yogurt con la menta tritata e un pizzico di sale; condisci l'insalata con il limone.","Completa la mujaddara con le cipolle rimaste e servi con lo yogurt e l'insalata."],tip:"Le cipolle caramellate sono il segreto: non avere fretta.",items:[["lenticchie",220],["riso",50],["yogurt",150],["insalata",100],["olio",10]],new:!0,k:559,p:38,c:75,g:12,n:"E94",num:94},{title:"Falafel al forno con bulgur e tahina",paese:"Medio Oriente",tag:"Vegana",slot:"Pranzo o cena",when:"Pranzo o cena",portions:"1 porzione",time:"40 minuti",foods:[{q:"210 g",n:"ceci lessati",h:""},{q:"30 g",n:"farina di ceci",h:""},{q:"30 g",n:"bulgur",h:""},{q:"100 g",n:"pomodori/pomodorini",h:""},{q:"100 g",n:"cetriolo",h:""},{q:"10 g",n:"tahina (crema di sesamo)",h:""},{q:"100 g",n:"yogurt di soia bianco senza zuccheri",h:""},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"}],dose:"",extra:"prezzemolo, coriandolo, cipolla, aglio, cumino, limone",steps:["Asciuga bene i ceci e frullali a scatti con prezzemolo, coriandolo, cipolla, aglio, cumino e la farina di ceci: l'impasto deve restare granuloso, non una crema.","Lascialo 15 minuti in frigo, poi forma 10 palline e schiacciale leggermente.","Spennellale d'olio e cuocile in forno a 200°C per 25 minuti, girandole a metà.","Cuoci il bulgur in acqua salata per 10 minuti, scolalo e condiscilo con pomodori, cetriolo e limone.","Mescola tahina, yogurt di soia, limone e un goccio d'acqua per la salsa e servi tutto insieme."],tip:"Al forno invece che fritti: stesso profumo, un decimo dell'olio.",items:[["ceci",210],["farina_ceci",30],["bulgur",30],["pomodori",100],["cetriolo",100],["tahina",10],["yogurt_soia",100],["olio",5]],new:!0,k:619,p:33,c:76,g:20,n:"E95",num:95},{title:"Tacos di fagioli neri e tofu",paese:"Messico",tag:"Vegana",slot:"Pranzo o cena",when:"Pranzo o cena",portions:"1 porzione",time:"25 minuti",foods:[{q:"80 g",n:"tortillas di mais",h:"3 tortillas piccole"},{q:"150 g",n:"fagioli lessati",h:""},{q:"120 g",n:"tofu naturale",h:""
