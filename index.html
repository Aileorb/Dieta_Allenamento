ioli",100],["olio",5],["pane_int",30]]},items:[["merluzzo",220],["verdure",300],["fagioli",100],["olio",10],["pane_int",30]]}],prep:["Pranzo: prepara il ragù magro (se il macinato è surgelato, scongelalo prima in frigo): cuoce a lungo e il giorno dopo è più saporito. Con l'alternativa vegana vale lo stesso per il ragù di soia.","Cena: scongela il merluzzo in frigo.","Se corri: tieni pronti pane, miele e banana da aggiungere alla colazione."]}],recipes:[{n:1,title:"Overnight oats «tiramisù»",tag:"Vegetariana",when:"Colazione del martedì",portions:"1 porzione",time:"5 minuti + una notte in frigo",foods:[{q:"70 g",n:"fiocchi d'avena",h:""},{q:"200 g",n:"Skyr naturale",h:""},{q:"120 ml",n:"latte scremato",h:""},{q:"5 g",n:"cacao amaro in polvere",h:"1 cucchiaino"},{q:"10 g",n:"miele",h:"1 cucchiaino abbondante"},{q:"10 g",n:"noci",h:"≈2 noci"}],dose:"",extra:"1 tazzina di caffè espresso freddo, un pizzico di cannella (facoltativo)",steps:["In un barattolo mescola l'avena con il latte e il caffè freddo; lascia assorbire 5 minuti.","A parte lavora lo skyr con il miele finché diventa una crema liscia.","Alterna gli strati: avena al caffè, crema di skyr, di nuovo avena e infine skyr.","Chiudi e lascia in frigo tutta la notte (almeno 6 ore).","Al mattino spolvera con il cacao amaro e completa con le noci tritate grossolanamente."],tip:"Il caffè della ricetta conta tra le 2-3 tazzine della giornata. Versione vegana: yogurt e latte di soia (proteine più basse, vedi le regole).",k:526,p:38,c:65,g:13,items:[["avena",70],["skyr",200],["latte",120],["cacao",5],["miele",10],["noci",10]]},{n:2,title:"Pancake di avena e albumi ai frutti di bosco",tag:"Vegetariana",when:"Colazione del sabato",portions:"1 porzione (circa 6 pancake)",time:"15 minuti",foods:[{q:"60 g",n:"fiocchi d'avena",h:""},{q:"250 g",n:"albume d'uovo",h:"≈7-8 albumi"},{q:"100 g",n:"yogurt greco 0%",h:""},{q:"100 g",n:"frutti di bosco",h:""},{q:"10 g",n:"crema 100% arachidi",h:"1 cucchiaino abbondante"}],dose:"",extra:"1 cucchiaino di lievito per dolci, cannella, qualche goccia di aroma vaniglia",steps:["Frulla l'avena fino a ridurla in farina.","Aggiungi albumi, lievito, cannella e vaniglia e frulla ancora fino a una pastella liscia; lasciala riposare 5 minuti.","Scalda una padella antiaderente a fuoco medio e ungila appena con carta da cucina (bastano poche gocce d'olio).","Versa un piccolo mestolo di pastella per volta: gira il pancake quando compaiono le bollicine in superficie (circa 2 minuti), poi 1 minuto dall'altro lato.","Impila i pancake e completa con yogurt, frutti di bosco e la crema di arachidi scaldata 10 secondi per renderla fluida."],tip:"I frutti di bosco surgelati, scaldati 2 minuti in padella, diventano una salsa senza zucchero aggiunto.",k:490,p:49,c:50,g:10,items:[["avena",60],["albume",250],["yogurt",100],["bosco",100],["arachidi_crema",10]]},{n:3,title:"Tagliatelle al ragù di soia",tag:"Vegana",when:"Pranzo della domenica, alternativa vegana",portions:"1 porzione (il ragù si può fare per 3-4)",time:"45 minuti",foods:[{q:"70 g",n:"pasta di semola",h:""},{q:"60 g",n:"soia texturizzata (granulare, secca)",h:""},{q:"200 g",n:"passata di pomodoro",h:""},{q:"150 g",n:"verdure miste",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"250 ml di brodo vegetale caldo, 1 foglia di alloro, rosmarino, 1 cucchiaino di salsa di soia, noce moscata, pepe. Tra le verdure: carota, sedano e cipolla per il soffritto",steps:["Idrata la soia texturizzata nel brodo caldo per 10 minuti, poi strizzala bene con le mani.","Trita finemente carota, sedano e cipolla e falli appassire a fuoco dolce con l'olio e 2 cucchiai d'acqua per 5-6 minuti.","Aggiungi la soia e rosolala a fuoco vivace per 3-4 minuti, finché si dora: è il passaggio che le dà il sapore «da ragù». Sfuma con la salsa di soia.","Unisci passata, alloro e rosmarino; cuoci coperto a fuoco basso 25-30 minuti, aggiungendo un po' di brodo se si asciuga troppo.","Cuoci la pasta, scolala al dente e mantecala nel ragù con un cucchiaio di acqua di cottura."],tip:"Prepara una dose tripla e congelala in porzioni: dura 3 mesi. Ottima anche per lasagne o peperoni ripieni. Usa pasta di semola: quella all'uovo non è vegana.",k:593,p:43,c:76,g:13,items:[["pasta",70],["soia_text",60],["passata",200],["verdure",150],["olio",10]]},{n:4,title:"Straccetti di seitan al limone e rosmarino con patate al forno",tag:"Vegana",when:"Cena del giovedì, alternativa vegana",portions:"1 porzione",time:"40 minuti (patate comprese)",foods:[{q:"200 g",n:"seitan",h:""},{q:"280 g",n:"patate",h:""},{q:"150 g",n:"insalata mista",h:""},{q:"15 g",n:"olio extravergine d'oliva",h:"1 cucchiaio e ½"}],dose:"",extra:"1 limone (succo e scorza grattugiata), 2 rametti di rosmarino, 1 spicchio d'aglio, 1 cucchiaino di amido di mais, pepe",steps:["Taglia le patate a spicchi, condiscile con 5 g d'olio, rosmarino e un pizzico di sale; cuocile in forno ventilato a 200°C per 35 minuti, girandole a metà.","Taglia il seitan a straccetti sottili.","In una padella antiaderente scalda 5 g d'olio con l'aglio schiacciato, aggiungi il seitan e rosolalo 4-5 minuti finché è dorato.","Sciogli l'amido nel succo di limone con 3 cucchiai d'acqua, versalo in padella e lascia addensare 1 minuto: si forma una cremina lucida.","Completa con scorza di limone, rosmarino tritato e pepe; servi con le patate e la rucola condita con i restanti 5 g d'olio."],tip:"Il seitan è già cotto: non prolungare la cottura o diventa gommoso.",k:630,p:54,c:60,g:20,items:[["seitan",200],["patate",280],["insalata",150],["olio",15]]},{n:5,title:"Tofu croccante al forno con riso integrale e verdure saltate",tag:"Vegana",when:"Pranzo del venerdì",portions:"1 porzione",time:"40 minuti (ottimo da preparare la sera prima)",foods:[{q:"230 g",n:"tofu naturale",h:""},{q:"60 g",n:"riso integrale",h:""},{q:"200 g",n:"verdure miste",h:""},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"}],dose:"",extra:"1 cucchiaio di salsa di soia, 1 cm di zenzero fresco grattugiato, 1 spicchio d'aglio, 1 cucchiaino di amido di mais, succo di mezzo lime o limone",steps:["Asciuga il tofu e pressalo 15 minuti tra fogli di carta da cucina con un peso sopra (un tagliere con un barattolo).","Taglialo a cubetti e marinalo 15 minuti con salsa di soia, zenzero e aglio.","Sgocciolalo, passalo nell'amido e cuocilo su carta forno in forno ventilato a 200°C per 25 minuti, girandolo a metà, finché è dorato e croccante.","Intanto cuoci il riso integrale (circa 40 minuti, oppure usa quello precotto).","Salta le verdure (peperoni, zucchine, carote, broccoli) in padella con l'olio per 3-4 minuti, restando croccanti; unisci la marinata avanzata e il lime, poi componi il piatto."],tip:"Il tofu croccante si conserva 3 giorni in frigo ed è ottimo anche freddo, nelle insalate.",k:598,p:39,c:56,g:24,items:[["tofu",230],["riso_int",60],["verdure",200],["olio",5]]},{n:6,title:"Burger di lenticchie e soia con spinaci",tag:"Vegana",when:"Cena del venerdì, alternativa vegana",portions:"2 burger (1 porzione)",time:"40 minuti",foods:[{q:"150 g",n:"lenticchie lessate",h:""},{q:"40 g",n:"soia texturizzata (granulare, secca)",h:""},{q:"20 g",n:"fiocchi d'avena",h:""},{q:"5 g",n:"semi di lino macinati",h:"1 cucchiaino"},{q:"200 g",n:"spinaci",h:""},{q:"40 g",n:"pane integrale",h:"1 fetta grande"},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"½ cipolla, 1 cucchiaino di paprika affumicata, ½ cucchiaino di cumino, prezzemolo, 1 cucchiaino di senape, brodo vegetale caldo, aglio",steps:["Idrata la soia in brodo caldo per 10 minuti e strizzala. Mescola il lino macinato con 3 cucchiai d'acqua e lascialo 5 minuti: diventa gelatinoso e fa da legante.","Frulla grossolanamente le lenticchie ben scolate con cipolla, spezie, senape e prezzemolo.","Unisci soia, avena e lino e impasta; se è troppo morbido aggiungi un cucchiaio di avena. Forma 2 burger e mettili 20 minuti in frigo.","Spennellali con 5 g d'olio e cuocili in forno a 200°C per 20-25 minuti, girandoli a metà (oppure in padella antiaderente, 4 minuti per lato).","Salta gli spinaci con l'aglio e i restanti 5 g d'olio; servi con il pane integrale tostato."],tip:"Si congelano crudi, separati da carta forno: pronti per le serate di fretta.",k:564,p:45,c:59,g:17,items:[["lenticchie",150],["soia_text",40],["avena",20],["lino",5],["spinaci",200],["pane_int",40],["olio",10]]},{n:7,title:"Salmone in crosta di noci ed erbe con patate e broccoli",tag:"Pesce",when:"Cena del lunedì",portions:"1 porzione",time:"40 minuti (patate comprese)",foods:[{q:"160 g",n:"salmone fresco",h:""},{q:"10 g",n:"noci",h:"≈2 noci"},{q:"250 g",n:"patate",h:""},{q:"250 g",n:"broccoli",h:""},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"}],dose:"",extra:"1 cucchiaino di senape, prezzemolo e aneto (o erba cipollina), scorza di mezzo limone, pepe",steps:["Taglia le patate a spicchi, condiscile con l'olio e cuocile in forno ventilato a 200°C per 35 minuti.","Trita finemente noci, erbe e scorza di limone.","Spennella la parte superiore del salmone con la senape e premi sopra la crosta di noci.","Negli ultimi 12-14 minuti metti il salmone nel forno insieme alle patate: il cuore deve restare rosato.","Cuoci i broccoli al vapore per 6-7 minuti e condiscili con succo di limone."],tip:"Le noci sostituiscono parte dell'olio: stessi grassi, ma con omega-3 vegetali in più.",k:700,p:46,c:52,g:34,items:[["salmone",160],["noci",10],["patate",250],["broccoli",250],["olio",5]]},{n:8,title:"Pollo al curry e yogurt con riso basmati e zucchine",tag:"Carne",when:"Pranzo del martedì",portions:"1 porzione",time:"25 minuti + marinatura",foods:[{q:"160 g",n:"petto di pollo",h:""},{q:"50 g",n:"yogurt greco 0%",h:"2 cucchiai, per la marinatura"},{q:"80 g",n:"riso basmati",h:""},{q:"200 g",n:"zucchine",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"1 cucchiaino di curry, ½ cucchiaino di curcuma, 1 cm di zenzero, 1 spicchio d'aglio, succo di mezzo limone, prezzemolo o corian ane in un barattolo chiuso."],tip:"Versione vegana: sciroppo d'acero al posto del miele e 1 cucchiaio d'acqua al posto dell'albume (fa meno «cluster», ma è ugualmente croccante).",k:282,p:9,c:39,g:10,items:[["avena",50],["noci",10],["miele",10],["albume",10]]},{n:2,title:"Porridge «apple pie» con yogurt e noci",tag:"Vegetariana",when:"Colazione del martedì",portions:"1 porzione",time:"10 minuti",foods:[{q:"70 g",n:"fiocchi d'avena",h:""},{q:"250 ml",n:"latte scremato",h:""},{q:"150 g",n:"mela",h:"1 media"},{q:"120 g",n:"yogurt greco 0%",h:""},{q:"15 g",n:"noci",h:"≈3 noci"}],dose:"",extra:"1 cucchiaino di cannella, un pizzico di noce moscata e di sale, qualche goccia di vaniglia",steps:["Taglia la mela a cubetti e cuocila in un pentolino con 2 cucchiai d'acqua e metà della cannella per 3-4 minuti, finché si ammorbidisce.","Aggiungi avena, latte, sale, noce moscata e il resto della cannella; cuoci a fuoco medio 4-5 minuti mescolando.","Togli dal fuoco, lascia intiepidire un minuto e incorpora metà dello yogurt con la vaniglia: diventa cremosissimo.","Servi con il resto dello yogurt e le noci tostate 2 minuti in padella: il profumo è quello di una torta di mele."],tip:"Con le pere e lo zenzero al posto di mela e cannella diventa un'ottima variante invernale.",k:582,p:33,c:78,g:16,items:[["avena",70],["latte",250],["mela",150],["yogurt",120],["noci",15]]},{n:3,title:"Muffin di avena e mirtilli",tag:"Vegetariana",when:"Colazione del giovedì",portions:"6 muffin (3 porzioni da 2)",time:"35 minuti",foods:[{q:"50 g",n:"fiocchi d'avena",h:""},{q:"60 g",n:"yogurt greco 0%",h:""},{q:"60 g",n:"albume d'uovo",h:"2 albumi"},{q:"50 g",n:"banana",h:"½ banana"},{q:"40 g",n:"frutti di bosco",h:""}],dose:"6 muffin: 150 g di fiocchi d'avena, 180 g di yogurt greco 0%, 180 g di albumi (≈5-6), 150 g di banana matura, 120 g di mirtilli",extra:"8 g di lievito per dolci, 1 cucchiaino di cannella, vaniglia, un pizzico di sale",steps:["Scalda il forno a 180°C e prepara 6 pirottini di carta o silicone.","Frulla l'avena fino a ottenere una farina; unisci lievito, cannella e sale.","In un'altra ciotola schiaccia la banana con la forchetta e mescola con yogurt, albumi e vaniglia.","Unisci i due composti senza lavorare troppo, poi incorpora i mirtilli (se surgelati, passali prima in un cucchiaio di farina d'avena perché non affondino).","Riempi i pirottini e cuoci 22-25 minuti: sono pronti quando uno stecchino esce asciutto. Durano 4 giorni in frigo, o si congelano."],tip:"Scaldati 20 secondi al microonde tornano morbidi come appena sfornati. La banana matura sostituisce lo zucchero.",k:300,p:20,c:46,g:4,items:[["avena",50],["yogurt",60],["albume",60],["banana",50],["bosco",40]]},{n:4,title:"French toast integrale con frutti di bosco",tag:"Vegetariana",when:"Colazione del sabato",portions:"1 porzione",time:"15 minuti",foods:[{q:"80 g",n:"pane integrale",h:"2-3 fette"},{q:"60 g",n:"uovo intero",h:"1 uovo medio"},{q:"120 g",n:"albume d'uovo",h:"≈4 albumi"},{q:"50 ml",n:"latte scremato",h:""},{q:"150 g",n:"frutti di bosco",h:""},{q:"150 g",n:"yogurt greco 0%",h:""},{q:"10 g",n:"miele",h:"1 cucchiaino abbondante"},{q:"15 g",n:"noci",h:"≈3 noci"}],dose:"",extra:"1 cucchiaino di cannella, vaniglia, scorza d'arancia",steps:["Sbatti uovo, albumi, latte, cannella, vaniglia e scorza d'arancia in un piatto fondo.","Immergi le fette di pane 20 secondi per lato, finché si imbevono senza sfaldarsi.","Cuocile in una padella antiaderente appena unta a fuoco medio, 2-3 minuti per lato, finché sono dorate.","Intanto scalda i frutti di bosco in un pentolino per 2 minuti: diventano una salsa.","Servi con la salsa di frutti di bosco, lo yogurt, il miele e le noci tritate."],tip:"Il pane del giorno prima si imbeve meglio. Versione vegana: latte di soia e 30 g di farina di ceci al posto di uovo e albumi.",k:617,p:48,c:64,g:19,items:[["pane_int",80],["uovo",60],["albume",120],["latte",50],["bosco",150],["yogurt",150],["miele",10],["noci",15]]},{n:5,title:"Burrito bowl con pollo, fagioli, mais e avocado",tag:"Carne",when:"Pranzo del mercoledì",portions:"1 porzione",time:"30 minuti (ottima da portare al lavoro)",foods:[{q:"70 g",n:"riso integrale",h:""},{q:"140 g",n:"petto di pollo",h:""},{q:"150 g",n:"fagioli lessati",h:""},{q:"50 g",n:"mais dolce (sgocciolato)",h:""},{q:"100 g",n:"peperoni",h:""},{q:"100 g",n:"pomodori/pomodorini",h:""},{q:"40 g",n:"avocado",h:"¼ scarso di avocado"},{q:"30 g",n:"yogurt greco 0%",h:"1 cucchiaio abbondante"},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"}],dose:"",extra:"paprika affumicata, cumino, origano, 1 lime, coriandolo o prezzemolo, ¼ di cipolla rossa, peperoncino a piacere",steps:["Cuoci il riso integrale (o usa quello precotto).","Taglia il pollo a striscioline, condiscilo con paprika, cumino, origano e succo di mezzo lime; cuocilo in padella con l'olio per 6-8 minuti.","Prepara il pico de gallo: pomodori e cipolla rossa a dadini, coriandolo, lime e un pizzico di sale.","Scalda i fagioli con un pizzico di cumino e salta i peperoni a listarelle per 3-4 minuti.","Componi la bowl a spicchi: riso, pollo, fagioli, mais, peperoni, pico de gallo, avocado a fette e lo yogurt mescolato con lime (la «sour cream» leggera)."],tip:"Da portare al lavoro: tieni avocado e yogurt a parte e aggiungili al momento. Versione vegana: 200 g di tofu sbriciolato con le stesse spezie.",k:730,p:56,c:89,g:17,items:[["riso_int",70],["pollo",140],["fagioli",150],["mais",50],["peperoni",100],["pomodori",100],["avocado",40],["yogurt",30],["olio",5]]},{n:6,title:"Polpette di tacchino e avena al sugo con purè leggero",tag:"Carne",when:"Cena del martedì",portions:"1 porzione (8-10 polpette)",time:"40 minuti",foods:[{q:"180 g",n:"fesa di tacchino",h:""},{q:"20 g",n:"fiocchi d'avena",h:""},{q:"30 g",n:"albume d'uovo",h:"1 albume"},{q:"150 g",n:"passata di pomodoro",h:""},{q:"250 g",n:"patate",h:""},{q:"60 ml",n:"latte scremato",h:""},{q:"150 g",n:"spinaci",h:""},{q:"15 g",n:"olio extravergine d'oliva",h:"1 cucchiaio e ½"}],dose:"",extra:"prezzemolo, 1 spicchio d'aglio, scorza di limone, noce moscata, basilico, sale e pepe",steps:["Frulla o fai macinare la fesa di tacchino; impastala con avena, albume, prezzemolo, scorza di limone, sale e pepe. Forma 8-10 polpette.","In una padella scalda 5 g d'olio con l'aglio, aggiungi la passata e il basilico e cuoci 10 minuti.","Adagia le polpette nel sugo, copri e cuoci a fuoco dolce 15-20 minuti, girandole a metà.","Lessa le patate, schiacciale e montale con il latte caldo, 5 g d'olio, noce moscata e sale: un purè senza burro.","Salta gli spinaci con i restanti 5 g d'olio e servi tutto insieme."],tip:"L'avena al posto del pangrattato lega l'impasto e porta beta-glucani. Versione vegana: lenticchie e soia texturizzata con lo stesso procedimento.",k:694,p:63,c:66,g:20,items:[["tacchino",180],["avena",20],["albume",30],["passata",150],["patate",250],["latte",60],["spinaci",150],["olio",15]]},{n:7,title:"Fajitas di manzo con piadine integrali fatte in casa",tag:"Carne",when:"Cena del giovedì",portions:"1 porzione (2 piadine)",time:"35 minuti",foods:[{q:"160 g",n:"manzo magro (fesa/magatello)",h:""},{q:"200 g",n:"peperoni",h:""},{q:"70 g",n:"farina integrale",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"},{q:"60 g",n:"yogurt greco 0%",h:""},{q:"60 g",n:"avocado",h:"¼ abbondante di avocado"}],dose:"",extra:"½ cipolla, 1 lime, paprika, cumino, aglio in polvere, erba cipollina, un pizzico di bicarbonato, 40 ml di acqua tiepida, sale",steps:["Piadine: impasta farina, bicarbonato, sale, 5 g d'olio e l'acqua tiepida fino a un panetto liscio; lascia riposare 15 minuti coperto.","Taglia il manzo a striscioline e marinalo con paprika, cumino, aglio in polvere e succo di mezzo lime.","Dividi l'impasto in 2, stendilo sottile e cuoci ogni piadina in una padella rovente senza grassi, 1-2 minuti per lato.","Nella stessa padella salta peperoni e cipolla a listarelle con 5 g d'olio per 5-6 minuti, poi aggiungi il manzo per 2-3 minuti a fuoco vivace.","Prepara la salsa con yogurt, lime ed erba cipollina e componi le fajitas con carne, verdure, avocado e salsa."],tip:"La piadina tradizionale romagnola usa lo strutto: questa versione con olio extravergine ha una frazione dei grassi saturi. Versione vegana: seitan a straccetti.",k:659,p:52,c:55,g:26,items:[["manzo",160],["peperoni",200],["farina_int",70],["olio",10],["yogurt",60],["avocado",60]]},{n:8,title:"Salmone teriyaki con riso basmati e broccoli",tag:"Pesce",when:"Cena del venerdì",portions:"1 porzione",time:"25 minuti",foods:[{q:"150 g",n:"salmone fresco",h:""},{q:"10 ml",n:"salsa di soia",h:"2 cucchiaini"},{q:"5 g",n:"miele",h:"1 cucchiaino raso"},{q:"60 g",n:"riso basmati",h:""},{q:"250 g",n:"broccoli",h:""},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"}],dose:"",extra:"1 cm di zenzero fresco, 1 spicchio d'aglio, 1 cucchiaino di amido di mais, 3 cucchiai d'acqua, succo di lime",steps:["Prepara la glassa: salsa di soia, miele, zenzero grattugiato, aglio schiacciato, acqua e amido sciolto.","Cuoci il riso basmati (10-12 minuti) e i broccoli al vapore (6-7 minuti).","In una padella antiaderente scalda l'olio e cuoci il salmone dal lato della pelle per 4 minuti, poi giralo per altri 2-3 minuti.","Versa la glassa e lasciala addensare 1 minuto, bagnando il salmone con un cucchiaio finché diventa lucido.","Servi con riso, broccoli e qualche goccia di lime."],tip:"Usa salsa di soia a ridotto contenuto di sale. Versione vegana: tofu a fette con sciroppo d'acero al posto del miele.",k:655,p:43,c:61,g:26,items:[["salmone",150],["salsa_soia",10],["miele",5],["riso",60],["broccoli",250],["olio",5]]},{n:9,title:"Pizza integrale fatta in casa con verdure e mozzarella light",tag:"Vegetariana",when:"Cena del sabato",portions:"1 pizza",time:"20 minuti + lievitazione",foods:[{q:"110 g",n:"farina integrale",h:""},{q:"80 g",n:"passata di pomodoro",h:""},{q:"60 g",n:"mozzarella light",h:""},{q:"80 g",n:"zucchine",h:""},{q:"80 g",n:"melanzane",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"1 g di lievito di birra secco (o 3 g fresco), 75 ml di acqua, 2 g di sale, origano, basilico",steps:["Sciogli il lievito nell'acqua, aggiungi la farina e impasta; unisci sale e 5 g d'olio e lavora 8-10 minuti fino a un panetto liscio.","Lascia lievitare coperto 3-4 ore a temperatura ambiente, oppure 24 ore in frigo (più digeribile e saporita).","Griglia zucchine e melanzane a fette sottili. Stendi l'impasto su una teglia con carta forno, condisci con passata e origano.","Cuoci nel forno alla massima temperatura (250°C) per 8 minuti, poi aggiungi mozzarella e verdure e prosegui per altri 5-7 minuti.","All'uscita completa con il resto dell'olio a crudo e il basilico."],tip:"È la pizza «di piano»: la puoi mangiare anche senza usare un pasto libero. Versione vegana: tofu affumicato a cubetti al posto della mozzarella.",k:579,p:28,c:76,g:18,items:[["farina_int",110],["passata",80],["mozz_light",60],["zucchine",80],["melanzane",80],["olio",10]]},{n:10,title:"Paella di pollo, piselli e peperoni",tag:"Carne",when:"Pranzo della domenica",portions:"1 porzione",time:"40 minuti",foods:[{q:"90 g",n:"riso Carnaroli",h:""},{q:"140 g",n:"petto di pollo",h:""},{q:"100 g",n:"piselli (surgelati)",h:""},{q:"150 g",n:"peperoni",h:""},{q:"50 g",n:"passata di pomodoro",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"1 bustina di zafferano, 1 cucchiaino di paprika dolce, ½ cipolla, 1 spicchio d'aglio, 300 ml di brodo vegetale caldo, limone, prezzemolo",steps:["In una padella larga rosola il pollo a bocconcini con metà dell'olio per 5 minuti; tienilo da parte.","Nella stessa padella soffriggi cipolla, aglio e peperoni con l'olio rimasto per 5 minuti.","Aggiungi il riso e tostalo 1 minuto, poi paprika e passata.","Versa il brodo con lo zafferano sciolto, rimetti il pollo e aggiungi i piselli: cuoci 16-18 minuti a fuoco medio senza mescolare, così sul fondo si forma la crosticina tipica.","Lascia riposare 5 minuti coperta con un canovaccio; servi con spicchi di limone e prezzemolo."],tip:"Il Carnaroli tiene bene la cottura; va bene anche il riso specifico per paella. Versione vegana: ceci e tofu affumicato al posto del pollo.",k:662,p:46,c:89,g:14,items:[["riso_car",90],["pollo",140],["piselli",100],["peperoni",150],["passata",50],["olio",10]]},{n:11,title:"Curry di ceci e spinaci con riso basmati e raita",tag:"Vegetariana",when:"Cena del mercoledì",portions:"1 porzione",time:"30 minuti",foods:[{q:"200 g",n:"ceci lessati",h:""},{q:"200 g",n:"spinaci",h:""},{q:"100 g",n:"passata di pomodoro",h:""},{q:"60 g",n:"riso basmati",h:""},{q:"150 g",n:"yogurt greco 0%",h:""},{q:"10 g",n:"olio extravergine d'oliva",h:"1 cucchiaio"}],dose:"",extra:"½ cipolla, 1 spicchio d'aglio, 1 cm di zenzero, 1 cucchiaino di garam masala, ½ di curcuma e ½ di cumino; per la raita: ½ cetriolo, menta, limone",steps:["Soffriggi cipolla, aglio e zenzero tritati nell'olio per 4 minuti; aggiungi le spezie e tostale 1 minuto.","Unisci passata, ceci e mezzo bicchiere d'acqua; cuoci 12-15 minuti finché il sugo si addensa.","Aggiungi gli spinaci e lasciali appassire 2-3 minuti. Intanto cuoci il riso basmati.","Raita: grattugia il cetriolo, strizzalo e mescolalo con lo yogurt, la menta tritata, il limone e un pizzico di sale.","Servi il curry con il riso e la raita fresca a parte."],tip:"Niente latte di cocco: è ricco di grassi saturi. La cremosità arriva dalla raita. Versione vegana: yogurt di soia e 100 g di tofu nel curry.",k:683,p:42,c:92,g:16,items:[["ceci",200],["spinaci",200],["passata",100],["riso",60],["yogurt",150],["olio",10]]},{n:12,title:"Energy balls al cacao e datteri",tag:"Vegana",when:"Pre-allenamento del lunedì",portions:"12 palline (6 porzioni da 2)",time:"15 minuti + 30 in frigo",foods:[{q:"30 g",n:"datteri secchi",h:"≈4 datteri"},{q:"15 g",n:"fiocchi d'avena",h:""},{q:"10 g",n:"mandorle",h:"≈8 mandorle"},{q:"5 g",n:"cacao amaro in polvere",h:"1 cucchiaino"}],dose:"12 palline: 180 g di datteri, urt greco con granola in padella e pera",tag:"Vegetariana",slot:"Spuntino",when:"Spuntino",portions:"1 porzione",time:"5 minuti",foods:[{q:"170 g",n:"yogurt greco 0%",h:""},{q:"20 g",n:"fiocchi d'avena",h:""},{q:"5 g",n:"miele",h:"1 cucchiaino raso"},{q:"150 g",n:"pera",h:"1 media"}],dose:"",extra:"cannella",steps:["Tosta l'avena in padella antiaderente 2-3 minuti con miele e cannella, mescolando.","Lasciala raffreddare un minuto: diventa croccante.","Servi sullo yogurt con la pera a cubetti."],tip:"Granola «istantanea» senza forno: perfetta quando quella fatta in casa è finita.",k:258,p:20,c:40,g:2,items:[["yogurt",170],["avena",20],["miele",5],["pera",150]],new:!1},{n:"E12",num:12,title:"Ceci croccanti al forno e una mela",tag:"Vegana",slot:"Spuntino",when:"Spuntino",portions:"1 porzione",time:"35 minuti",foods:[{q:"120 g",n:"ceci lessati",h:""},{q:"5 g",n:"olio extravergine d'oliva",h:"1 cucchiaino"},{q:"150 g",n:"mela",h:"1 media"}],dose:"",extra:"paprika affumicata, cumino, aglio in polvere, sale",steps:["Sciacqua e asciuga molto bene i ceci con un canovaccio.","Condiscili con olio e spezie e stendili su carta forno.","Cuoci a 200°C per 30 minuti, scuotendo la teglia a metà, finché sono croccanti.","Lasciali raffreddare e mangiali con la mela."],tip:"Si possono fare in dose tripla: restano croccanti 2-3 giorni in un barattolo aperto.",k:260,p:9,c:37,g:8,items:[["ceci",120],["olio",5],["mela",150]],new:!1},{n:"E13",num:13,title:"Frullato fragola e banana con skyr",tag:"Vegetariana",slot:"Spuntino",when:"Spuntino",portions:"1 porzione",time:"3 minuti",foods:[{q:"170 g",n:"Skyr naturale",h:""},{q:"150 ml",n:"latte scremato",h:""},{q:"150 g",n:"fragole",h:""},{q:"80 g",n:"banana",h:"½ banana grande"},{q:"15 g",n:"fiocchi d'avena",h:""}],dose:"",extra:"ghiaccio a piacere, vaniglia",steps:["Metti tutto nel frullatore.","Frulla un minuto fino a un composto liscio e cremoso.","Bevi subito, con qualche cubetto di ghiaccio se fa caldo."],tip:"Ottimo dopo la corsa: protei
