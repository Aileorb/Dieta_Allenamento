<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Di&amp;T – diet &amp; training</title>
<meta name="description" content="Piano alimentare e allenamento">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Di&amp;T">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/muscolo5-180.png">
<link rel="icon" type="image/png" href="icons/muscolo5-192.png">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29);
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --indigo:#5856D6; --teal:#30B0C7; --yellow:#FFCC00; --pink:#FF2D55; --gray:#8E8E93;
  --bar:rgba(249,249,249,.86); --seg:#FFFFFF; --tint-bg:rgba(0,122,255,.12); --ch-spend:#D97706; --ch-work:#007AFF;
  --fig:#1C1C1E; --equip:#AEAEB2; --plate:var(--blue); --surface:var(--card);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --rounded:ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
    --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --indigo:#5E5CE6; --teal:#40C8E0; --yellow:#FFD60A; --pink:#FF375F; --gray:#8E8E93;
    --bar:rgba(22,22,22,.84); --seg:#636366; --tint-bg:rgba(10,132,255,.2); --ch-spend:#D97706; --ch-work:#0A84FF;
    --fig:#F2F2F7; --equip:#636366;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font:17px/22px var(--font);letter-spacing:-.41px;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.hidden{display:none !important}

/* ---------- struttura ---------- */
.screen{min-height:100dvh;padding-bottom:calc(49px + env(safe-area-inset-bottom) + 28px)}
.navbar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:transparent;transition:background .2s}
.navbar .in{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;max-width:720px;margin:0 auto}
.navbar .t{font-weight:600;font-size:17px;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.navbar.compact{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.navbar.compact .t,.navbar.always .t{opacity:1}
.navbar .back{justify-self:start;display:flex;align-items:center;gap:2px;border:none;background:none;color:var(--blue);font-size:17px;padding:8px 6px;margin-left:-4px}
.navbar .back svg{width:13px;height:21px}
.navbar .rt{justify-self:end}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.brand{height:56px;margin:4px 0 4px;transform-origin:left bottom;will-change:transform,opacity}
.brand svg{height:100%;width:auto;display:block;overflow:visible}
.navbar .t.brandt{max-width:none;justify-self:center}
/* nome fissato: sempre al centro; se lo spazio tra i pulsanti non basta si rimpicciolisce (proporzioni 7,24:1) */
.navbar .t.brandt svg{width:min(174px, calc(100vw - 196px));height:auto;display:block}
h1.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:2px 0 10px}
.lthead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 10px}
.lthead h1.lt{margin:0}
.lta{display:flex;align-items:center;gap:12px;flex:none}
.addbtn{width:34px;height:34px;border-radius:50%;border:none;padding:0;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;-webkit-tap-highlight-color:transparent}
.addbtn svg{width:18px;height:18px;stroke-width:2.6}
.addbtn:active,.avatar:active{opacity:.6}
.avatar{width:36px;height:36px;border-radius:50%;border:none;padding:0;overflow:hidden;background:linear-gradient(180deg,#A6A6AD,#86868C);color:#fff;display:grid;place-items:center;flex:none;font:600 15px/1 var(--rounded);letter-spacing:.3px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg{width:22px;height:22px;display:block}
.addbtn.sm{width:28px;height:28px}.addbtn.sm svg{width:15px;height:15px}
.avatar.sm{width:30px;height:30px;font-size:12px}.avatar.sm svg{width:18px;height:18px}
.navbar .rtc{display:inline-flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .15s;padding-right:8px}
.navbar.compact .rtc{opacity:1;pointer-events:auto}
.pfhead{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0 18px}
.pfpic{position:relative;width:96px;height:96px;border-radius:50%;overflow:visible;background:linear-gradient(180deg,#A6A6AD,#86868C);color:#fff;display:grid;place-items:center;font:600 36px/1 var(--rounded);cursor:pointer}
.pfpic img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.pfin{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.pfin > svg{width:56px;height:56px;display:block}
.pfpic .edit{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg2,var(--bg))}
.pfpic .edit svg{width:16px;height:16px}
.pfname{width:100%;max-width:320px;text-align:center;border:none;background:none;outline:none;font:700 22px/28px inherit;font-size:22px;font-weight:700;color:var(--label)}
.pflink{color:var(--blue);font-size:15px;cursor:pointer}
.miniseg{display:inline-flex;background:var(--fill);border-radius:8px;padding:2px;gap:2px}
.miniseg button{border:none;background:none;border-radius:6px;padding:5px 10px;font-size:14px;font-weight:500;color:var(--label)}
.miniseg button[aria-pressed="true"]{background:var(--seg);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.goals{flex-wrap:wrap;overflow:visible}
.goals button{margin-bottom:6px}
.sub-lt{color:var(--label2);font-size:15px;line-height:20px;margin:-6px 0 14px;letter-spacing:-.24px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{height:49px;display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;margin:0 auto}
.tabbar button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--gray);font-size:10px;line-height:12px;font-weight:500;letter-spacing:.1px;padding-top:4px}
.tabbar button svg{width:28px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--blue)}

/* ---------- liste raggruppate ---------- */
.sec{margin:0 0 22px}
.sec-h{font-size:13px;line-height:18px;letter-spacing:-.08px;color:var(--label2);text-transform:uppercase;margin:0 16px 6px;display:flex;justify-content:space-between;gap:8px;align-items:flex-end}
.sec-h .r{text-transform:none}
.sec-f{font-size:13px;line-height:18px;letter-spacing:-.08px;color:var(--label2);margin:6px 16px 0}
.list{background:var(--card);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;width:100%;text-align:left;border:none;background:none}
.row + .row::before,.row + .rowx::before,.rowx + .row::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.row.ind + .row::before,.row + .row.ind::before{left:60px}
.row .grow{flex:1;min-width:0}
.row .tt{font-size:17px;line-height:22px}
.row .st{font-size:13px;line-height:18px;color:var(--label2);letter-spacing:-.08px;margin-top:1px}
.row .val{color:var(--label2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .val .kv{color:var(--label)}
.row .chev{width:8px;height:14px;color:var(--label3);flex:none}
button.row:active,label.row:active{background:var(--fill2)}
.icon{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.icon svg{width:18px;height:18px}
.link{color:var(--blue)}
.destr{color:var(--red)}
.rowx{position:relative}

/* switch */
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.sw input:checked + i{background:var(--green)}
.sw input:checked + i::after{transform:translateX(20px)}
@media (prefers-color-scheme: dark){ .sw i{background:rgba(120,120,128,.32)} }

/* segmented */
.seg{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 16px;gap:0}
.seg button{border:none;background:none;border-radius:7px;font-size:13px;line-height:18px;font-weight:500;padding:6px 4px;letter-spacing:-.08px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--seg);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 0 18px;background:var(--card);border-radius:12px;padding:10px 6px 8px}
.strip button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.strip .wd{font-size:11px;line-height:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.06px}
.strip .c{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.strip .today .c{color:var(--red)}
.strip [aria-pressed="true"] .c{background:var(--label);color:var(--bg)}
.strip .today[aria-pressed="true"] .c{background:var(--red);color:#fff}
.strip .dot{width:5px;height:5px;border-radius:50%;background:var(--label3)}
.d-pesi{background:var(--blue) !important}.d-senza{background:var(--green) !important}.d-riposo{background:var(--label3) !important}.d-opt{background:var(--indigo) !important}.d-run{background:var(--orange) !important}
.strip .kc{font-size:10px;line-height:12px;color:var(--label2);font-variant-numeric:tabular-nums}

/* titoli di giornata */
.dayh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:0 0 10px}
.dayh h2{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px;margin:0}
.pchip{display:inline-block;border:0;background:rgba(0,122,255,.1);color:var(--blue);font-size:12px;line-height:18px;font-weight:600;padding:0 7px;border-radius:9px;margin-left:2px;vertical-align:1px;font-variant-numeric:tabular-nums;cursor:pointer}
.pchip.mine{background:rgba(52,199,89,.15);color:var(--green)}
.spend small{display:block;font-size:12px;line-height:15px;color:var(--green)}
.homeh{display:flex;justify-content:space-between;align-items:baseline;margin:34px 4px 10px}
.homeh h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px;margin:0}
.homeh span{color:var(--label2);font-size:15px}
.pin{flex:1;border:none;background:none;text-align:right;font:inherit;font-size:17px;color:var(--label);outline:none;min-width:0;height:28px}
.eu{color:var(--label2);margin-left:6px}
.formtop{display:flex;gap:14px;align-items:center}
.formtop .photobox{flex:none;cursor:pointer}
.bigin,.smin{display:block;width:100%;border:none;background:var(--card);border-radius:10px;outline:none;color:var(--label);font:inherit}
.bigin{font-size:19px;font-weight:600;padding:12px 12px;margin-bottom:8px}
.smin{font-size:15px;padding:10px 12px;color:var(--label)}
.frow{min-height:46px}
.fin{flex:1;border:none;background:none;text-align:right;font:inherit;font-size:17px;color:var(--label);outline:none;min-width:0;max-width:40%}
.fsel{border:none;background:none;font:inherit;font-size:17px;color:var(--blue);outline:none;text-align:right}
.ing{gap:8px}
.qin{width:88px;flex:none;border:none;background:var(--fill);border-radius:8px;padding:7px 8px;font:inherit;font-size:15px;color:var(--label);outline:none}
.nin{flex:1;min-width:0;border:none;background:none;font:inherit;font-size:16px;color:var(--label);outline:none}
.sheet textarea.stin{flex:1;width:auto;min-width:0;min-height:44px;border:none;border-radius:0;background:none;font:inherit;font-size:16px;line-height:21px;color:var(--label);outline:none;resize:none;padding:10px 0}
.ing .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--label2)}
.xbtn{flex:none;width:28px;height:28px;border:none;border-radius:50%;background:none;color:var(--label3);font-size:22px;line-height:1}
.okdot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--green)}
.stepper{display:inline-flex;align-items:center;gap:14px}
.stepper button{width:34px;height:30px;border:none;border-radius:8px;background:var(--fill);color:var(--label);font-size:20px;line-height:1}
.stepper b{font:600 17px/22px var(--rounded);min-width:18px;text-align:center}
.tt.link,.link{color:var(--blue)}
.editbtn{flex:none;align-self:flex-start;border:none;background:var(--tint-bg);color:var(--blue);font-size:13px;font-weight:600;border-radius:8px;padding:5px 10px}
.ex .top .grow{min-width:0}
img.fig{object-fit:cover}
.figph{display:grid!important;place-items:center;color:var(--label3)}
.figph svg{width:42px;height:36px}
.navbtn{border:none;background:none;color:var(--blue);font-size:17px;padding:0 4px}
.olh{display:flex;justify-content:space-between;align-items:center;gap:8px;text-transform:none;font-size:15px;font-weight:600;color:var(--label);letter-spacing:0}
.olh > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.olx.off .olh > span:first-child{color:var(--label3);text-decoration:line-through}
.olrow{gap:8px}
.oln{flex:none;width:22px;height:22px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--label2)}
.olin{flex:1;min-width:0;border:none;background:var(--fill);border-radius:8px;padding:8px 10px;font:inherit;font-size:16px;color:var(--label);outline:none;text-align:right}
.olin.sm{flex:none;width:64px}
.olx2,.olu{color:var(--label2);font-size:15px}
.olbtns{gap:18px;min-height:40px}
.lnkbtn.destr{color:var(--red)}
.fin.dt{max-width:none;color:var(--blue)}
.rnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.rnav b{font-size:20px;font-weight:700}
.rnav button{width:36px;height:36px;border-radius:50%;border:none;background:var(--fill);color:var(--blue);padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.rnav button svg{width:9px;height:16px;display:block}
.rnav button:disabled{opacity:.3}
.rkpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.rk{background:var(--card);border-radius:14px;padding:12px 14px}
.rk span{display:block;font-size:13px;color:var(--label2);font-weight:500}
.rk b{display:block;font:700 24px/30px var(--rounded);font-variant-numeric:tabular-nums;margin-top:2px}
.dlt{display:block;font-size:12px;line-height:16px;color:var(--label2);font-weight:600}
.dlt.good{color:var(--green)} .dlt.bad{color:var(--red)}
.chcard{background:var(--card);border-radius:14px;padding:12px 10px 10px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--sep);stroke-width:.6}
.chart .bl{stroke:var(--label3);stroke-width:1}
.chart .ax{font-size:9.5px;fill:var(--label2);font-family:inherit}
.chart .mk-spend{fill:var(--ch-spend)} .chart .mk-work{fill:var(--ch-work)}
.chart .bar.part path{opacity:.45}
.chart .bar:focus{outline:none} .chart .bar:focus path,.chart .bar:hover path{filter:brightness(1.12)}
.chv{display:grid;margin-top:4px;font-size:12px;line-height:16px;color:var(--label);text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.chempty{margin:6px 4px;font-size:15px;line-height:20px;color:var(--label2)}
.recapb{margin-bottom:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;line-height:18px;font-weight:600;padding:3px 9px;border-radius:12px;background:var(--fill);color:var(--label2);white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%}
.badge.b-orange{background:rgba(255,149,0,.15);color:var(--orange)}
.badge.b-indigo{background:rgba(88,86,214,.15);color:var(--indigo)}
.badge.b-green{background:rgba(52,199,89,.15);color:var(--green)}
.badge.b-blue{background:var(--tint-bg);color:var(--blue)}

/* riepilogo macro */
.macros{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;background:var(--card);border-radius:12px;padding:12px 4px;margin:0 0 22px}
.macros div{padding:0 10px;border-left:.5px solid var(--sep)}
.macros div:first-child{border:none}
.macros span{display:block;font-size:12px;line-height:16px;font-weight:600}
.macros b{display:block;font:700 22px/28px var(--rounded);font-variant-numeric:tabular-nums;letter-spacing:.35px}
.macros small{font-size:12px;color:var(--label2);font-weight:500}
.c-kcal{color:var(--red)}
.kv{font-weight:600;font-variant-numeric:tabular-nums} .c-p{color:var(--blue)} .c-c{color:var(--green)} .c-g{color:var(--orange)}

/* pasti */
.meal{margin:0 0 22px}
.meal.off{opacity:.45}
.meal .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 16px 6px}
.meal .hd .n{font-size:13px;line-height:18px;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px;display:inline-flex;align-items:center}
.meal .hd{align-items:center}
.meal .hd .pi{width:20px;height:20px;margin:0 0 0 6px;vertical-align:0}
.meal .hd .pi svg{width:20px;height:20px}
.meal .hd .tm{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.mtitle{padding:12px 16px 10px}
.mtitle .tt{font-size:17px;line-height:22px;font-weight:600}
.stairw{display:flex;align-items:center;gap:16px;padding:14px 16px 10px}
.stairw svg{width:132px;height:auto;flex:none;overflow:visible}
.stairw .info{display:flex;flex-direction:column;min-width:0}
.stairw .info b{font-size:34px;line-height:38px;font-weight:700;font-variant-numeric:tabular-nums}
.stairw .info b small{font-size:20px;font-weight:600;color:var(--label2)}
.stairw .info .lab{font-size:15px;color:var(--label2)}
.stairw .info .msg{font-size:15px;line-height:20px;font-weight:600;margin-top:6px}
.sts{fill:var(--fill)}.sts.on{fill:var(--blue)}
.stb{fill:none;stroke:var(--label3);stroke-width:1.5;stroke-dasharray:4 3}.stb.on{fill:#FFB800;stroke:none}
.stg{stroke:var(--sep);stroke-width:1.5}
.stface{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.stface.happy{animation:stbob 2.4s ease-in-out infinite}
@keyframes stbob{50%{translate:0 -2px}}
@media (prefers-reduced-motion: reduce){.stface{transition:none}.stface.happy{animation:none}}
.quote{padding:12px 16px 14px;font-size:15px;line-height:21px;font-style:italic;position:relative}
.quote::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.quote span{display:block;font-style:normal;font-size:13px;color:var(--label2);margin-top:4px}
.mlink{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;color:inherit;font:inherit}
.mlink .grow{flex:1;min-width:0}
.mlink .chev{width:8px;height:14px;color:var(--label3);flex:none}
.mlink:active{background:var(--fill)}
.mtitle .mm{font-size:13px;line-height:18px;color:var(--label);margin-top:2px;font-variant-numeric:tabular-nums}
.mtitle .mm b{font-weight:600}
.food{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 16px;position:relative}
.food::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.food .fn{font-size:16px;line-height:21px;letter-spacing:-.32px}
.food .fh{font-size:13px;line-height:18px;color:var(--label2)}
.food .fq{font-size:16px;line-height:21px;color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.mnote{padding:10px 16px 12px;font-size:13px;line-height:18px;color:var(--label2);position:relative;letter-spacing:-.08px}
.mnote::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.altbtn{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;padding:11px 16px;position:relative;color:var(--green);font-size:15px;line-height:20px;font-weight:500}
.altbtn::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.altbtn .grow{flex:1}
.altbtn svg.ch{width:13px;height:13px;color:var(--label3);transition:transform .2s}
.altbtn[aria-expanded="true"] svg.ch{transform:rotate(90deg)}
.altbox{background:var(--card2);margin:0}
.altbox .mtitle .tt{font-size:16px}
.rl{color:var(--blue);border:none;background:none;padding:0;font:inherit}

/* checklist (stile Promemoria) */
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--label3);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:13px;height:13px;opacity:0;color:#fff}
.row.on .chk{background:var(--blue);border-color:var(--blue)}
.row.on .chk svg{opacity:1}
.row.on .tt{color:var(--label2)}
.row.ck{cursor:pointer}
.qx{display:block;font-size:12px;line-height:15px;color:var(--orange)}
.qn{display:block;font-size:12px;line-height:15px;color:var(--label2)}
.spend{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:10px;border-top:.5px solid var(--sep);font-size:15px;color:var(--label2)}
.progress .spend b{font:600 17px/22px var(--rounded);color:var(--label);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;font-size:11px;line-height:16px;font-weight:600;padding:0 6px;border-radius:5px;background:rgba(255,149,0,.16);color:var(--orange);vertical-align:1px;margin-left:4px}

/* progresso */
.progress{background:var(--card);border-radius:12px;padding:14px 16px;margin:0 0 22px}
.progress .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progress b{font:700 28px/32px var(--rounded);font-variant-numeric:tabular-nums}
.progress .t span{color:var(--label2);font-size:15px}
.track{height:6px;border-radius:3px;background:var(--fill)}
.track i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .25s}

/* ricerca e chip */
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 8px;height:36px;margin:0 0 12px}
.search svg{width:17px;height:17px;color:var(--label2);flex:none}
.search input{border:none;background:none;outline:none;flex:1;font-size:17px;min-width:0;height:100%}
.search input::placeholder{color:var(--label2)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 18px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:none;background:var(--card);border-radius:16px;padding:6px 14px;font-size:15px;line-height:20px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* dettaglio ricetta */
.rhead h2{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px;margin:4px 0 8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:12px;padding:12px 4px;margin:0 0 22px}
.stats div{padding:0 10px;border-left:.5px solid var(--sep)}
.stats div:first-child{border:none}
.stats span{display:block;font-size:12px;line-height:16px;color:var(--label2);font-weight:500}
.stats b{display:block;font:600 20px/25px var(--rounded);font-variant-numeric:tabular-nums}
.step{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:12px 16px;position:relative;font-size:16px;line-height:22px;letter-spacing:-.32px}
.step + .step::before{content:"";position:absolute;top:0;right:0;left:54px;height:.5px;background:var(--sep)}
.step .num{width:26px;height:26px;border-radius:50%;background:var(--tint-bg);color:var(--blue);display:grid;place-items:center;font:600 14px/1 var(--rounded)}
.callout{background:var(--card);border-radius:12px;padding:12px 16px;display:flex;gap:12px;font-size:15px;line-height:20px;margin:0 0 22px;letter-spacing:-.24px}
.callout svg{width:22px;height:22px;flex:none;color:var(--yellow)}

/* allenamento */
.ex{background:var(--card);border-radius:12px;margin:0 0 10px;overflow:hidden}
.ex .top{display:grid;grid-template-columns:96px 1fr auto;gap:12px;padding:12px 12px 10px 12px;align-items:center}
.ex .fig{width:96px;height:80px;border-radius:10px;background:var(--card2);display:block}
.ex .nm{font-size:17px;line-height:22px;font-weight:600}
.ex .nm small{color:var(--blue);font:600 15px/1 var(--rounded);margin-right:4px}
.ex .mu{font-size:13px;line-height:18px;color:var(--label2);margin-top:2px}
.ex .tg{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.ex .tg span{font-size:11px;line-height:13px;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--fill);color:var(--label2)}
.ex .tg span.k{background:var(--tint-bg);color:var(--blue)}
.ex .st4,.wo-st{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--sep);padding:9px 0}
.ex .st4 div,.wo-st div{text-align:center;border-left:.5px solid var(--sep)}
.ex .st4 div:first-child,.wo-st div:first-child{border:none}
.ex .st4 b,.wo-st b{display:block;font:600 19px/24px var(--rounded);font-variant-numeric:tabular-nums}
.ex .st4 span,.wo-st span{font-size:11px;line-height:13px;color:var(--label2)}
.ex .st4 .mod b,.wo-st .mod b{color:var(--orange)}
.ex .nt{font-size:13px;line-height:18px;color:var(--label2);padding:0 16px 10px}
.ex .fld{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:44px;border-top:.5px solid var(--sep)}
.ex .fld label{font-size:16px;flex:none;width:64px}
.ex .fld input{flex:1;border:none;background:none;text-align:right;font-size:16px;color:var(--label2);outline:none;min-width:0;height:44px}
.ex .fld input::placeholder{color:var(--label3)}
.ex .sug{font-size:13px;color:var(--orange);padding:8px 16px;border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:none;border-radius:12px;min-height:50px;font-size:17px;font-weight:600;background:var(--blue);color:#fff}
.btn.tinted{background:var(--tint-bg);color:var(--blue)}
.btn.sm{min-height:44px;border-radius:10px;font-size:16px}
.ex .go{padding:0 12px 12px}
.ssh{margin:0 16px 6px;font-size:13px;line-height:18px;color:var(--indigo);text-transform:uppercase;font-weight:600}
.group{margin:0 0 22px}
.sess h2{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px;margin:0}
.sess .meta{color:var(--label2);font-size:15px;margin:2px 0 14px}
.note-card{background:var(--card);border-radius:12px;padding:12px 16px;margin:0 0 12px;font-size:15px;line-height:20px;letter-spacing:-.24px}
.note-card.warn{background:rgba(255,149,0,.13)}
.note-card b{font-weight:600}
.seg.locked{opacity:.38;filter:grayscale(1);pointer-events:none}
.locknote{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px!important}
.locknote svg{flex:none;margin-top:2px;color:var(--label2)}
.danger{display:inline-flex;align-items:center;justify-content:center;vertical-align:-4px;margin-left:6px;padding:2px;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.danger svg{width:20px;height:20px;display:block}
.danger[aria-expanded="true"] svg{filter:drop-shadow(0 0 3px rgba(255,204,0,.8))}
.note-card.yellow{background:rgba(255,204,0,.2);box-shadow:inset 0 0 0 1px rgba(255,204,0,.55);display:flex;gap:10px;align-items:flex-start}
.note-card.yellow svg{width:22px;height:22px;flex:none;margin-top:-1px}
.note-card.yellow[hidden]{display:none}

/* icone proteina */
.pi{display:inline-grid;place-items:center;width:22px;height:22px;flex:none;vertical-align:-5px;margin-right:7px}
.pi svg{width:22px;height:22px}
.withpi{display:flex;align-items:flex-start;gap:0}
.withpi .pi{margin-top:0}

/* foto delle ricette */
.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;flex:none;background:var(--fill)}
.thumb.sm{width:40px;height:40px;border-radius:8px}
.rtop{display:grid;grid-template-columns:1fr 112px;gap:14px;align-items:start}
.photobox{width:112px;height:112px;border-radius:14px;border:none;padding:0;overflow:hidden;background:var(--card);display:grid;place-items:center;position:relative}
.photobox img{width:100%;height:100%;object-fit:cover;display:block}
.photobox.empty{border:1.5px dashed var(--label3);background:transparent;color:var(--blue);font-size:13px;font-weight:600;line-height:16px;text-align:center}
.photobox.empty svg{width:28px;height:28px;display:block;margin:0 auto 4px}
.photobox .edit{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.photobox .edit svg{width:14px;height:14px}
.bigphoto{width:100%;border-radius:12px;display:block;margin:0 0 16px;max-height:60vh;object-fit:cover}

/* macro nelle alternative */
.ml{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-size:13px;line-height:18px;color:var(--label);font-variant-numeric:tabular-nums}
.ml b{font-weight:700;margin-right:1px}
.dl{font-size:11px;margin-left:3px;font-weight:600}
.dl.up{color:var(--label2)} .dl.dn{color:var(--label2)}

/* fase del piano bloccata */
.lockbtn{border:none;background:none;padding:6px;margin:-6px -4px;color:var(--label2);display:inline-grid;place-items:center;min-width:32px;min-height:32px}
.phasebox.open .lockbtn{color:var(--blue)}
.phaseseg .seg{margin:0}
.phaseseg[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* banner e approvazione */
.banner{display:flex;align-items:center;gap:12px;width:100%;border:none;background:var(--card);border-radius:12px;padding:11px 14px;margin:0 0 16px;text-align:left}
.banner .st{font-size:13px;line-height:18px;color:var(--label2)}
.approve{background:var(--card);border-radius:12px;padding:14px 16px;margin:0 0 22px}
.approve .ah{display:flex;gap:12px;align-items:center}
.approve .st{font-size:13px;line-height:18px;color:var(--label2);margin-top:1px}
.approve p{font-size:15px;line-height:20px;margin:12px 0;letter-spacing:-.24px}
.approve .btn + .btn{margin-top:6px}
.btn.plain{background:none;color:var(--blue);font-weight:500;min-height:44px}
.btn.plain.destr{color:var(--red)}
.approve.ok .btn.plain{margin-top:8px}
button.row:disabled{opacity:.4}
.sheet .note-card{background:rgba(255,149,0,.13)}

/* sheet e timer */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:720px;margin:0 auto;background:var(--bg);border-radius:12px 12px 0 0;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-height:calc(100dvh - env(safe-area-inset-top) - 12px);display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sheet .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 16px 8px;min-height:44px}
.sheet .bar .t{font-weight:600;font-size:17px;text-align:center}
.sheet .bar button{border:none;background:none;color:var(--blue);font-size:17px;padding:6px 0}
.sheet .bar .r{justify-self:end;font-weight:600}
.sheet .body{overflow:auto;padding:0 16px 20px;-webkit-overflow-scrolling:touch}
.sheet textarea{width:100%;min-height:220px;border:none;border-radius:10px;background:var(--card);padding:12px;font:13px/18px ui-monospace,"SF Mono",Menlo,monospace;color:var(--label);resize:vertical}
.tm-ex{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px}
.tm-ex .fig{width:84px;height:70px;border-radius:9px;background:var(--card2);flex:none}
.tm-ex .nm{font-size:17px;line-height:22px;font-weight:600}
.tm-ex .s{font-size:13px;line-height:18px;color:var(--label2);margin-top:2px}
.dial{position:relative;width:min(72vw,270px);aspect-ratio:1;margin:14px auto 6px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .big{font:300 66px/1 var(--rounded);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.dial .ph{font-size:15px;color:var(--label2);margin-top:6px;text-align:center;padding:0 24px}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--fill)}
.dots i.d{background:var(--green)} .dots i.c{background:var(--label)}
.nx{text-align:center;font-size:13px;color:var(--label2);min-height:18px;margin-bottom:14px}
.clock{display:flex;justify-content:space-between;align-items:center;padding:0 8px;margin-bottom:16px}
.cbtn{width:84px;height:84px;border-radius:50%;border:none;padding:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:18px;font-weight:500;position:relative;flex:none}
.wo{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
body.wo-on .wo{display:block}
body.wo-on{overflow:hidden}
.wo-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.wo-meta{display:flex;flex-direction:column;gap:2px}
.wo-step{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.3px}
.wo-el{display:flex;align-items:center;gap:6px;font:600 20px/24px var(--rounded);font-variant-numeric:tabular-nums}
.rec{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;animation:recb 1.6s infinite}
@keyframes recb{50%{opacity:.25}}
.wo-btns{display:flex;gap:12px}
.cbtn2{width:44px;height:44px;border-radius:50%;border:none;padding:0;display:grid;place-items:center}
.cbtn2 svg{width:16px;height:16px}
.cbtn2.or{background:rgba(255,149,0,.2);color:var(--orange)}
.cbtn2.rd{background:rgba(255,59,48,.18);color:var(--red)}
.wo-in{max-width:560px;margin:0 auto;padding:6px 16px 0}
.wo-fig{background:var(--card);border-radius:18px;padding:10px;margin:6px 0 14px}
.wo-fig .fig{width:100%;height:auto;aspect-ratio:6/5;display:block;border-radius:12px;background:var(--card2)}
.wo-fig img.fig{object-fit:cover}
.wo-fig .figph svg{width:90px;height:76px}
.wo-ss{font-size:13px;font-weight:600;color:var(--indigo);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.wo-name{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px;margin:0}
.wo-mu{color:var(--label2);font-size:15px;margin-top:2px}
.wo-st{background:var(--card);border-radius:14px;margin:14px 0 10px;border-top:none!important;padding:12px 0!important}
.wo-st b{font-size:22px!important;line-height:28px!important}
.wo-st span{font-size:12px!important}
.wo-note{font-size:15px;color:var(--label2);margin:0 2px 8px}
.wo-sug{font-size:15px;color:var(--orange);margin:0 2px 8px}
.wo-dial{width:min(60vw,230px)}
.wo-nav{display:flex;gap:10px;margin:18px 0 10px}
.wo-nav .btn:disabled{opacity:.4}
.wo-start{margin:0 0 12px}
.lnkbtn{border:none;background:none;color:var(--blue);font-size:13px;padding:0;text-transform:none}
.womini{position:fixed;left:0;right:0;bottom:calc(49px + env(safe-area-inset-bottom));z-index:29;padding:0 10px 8px}
.wm{width:100%;max-width:700px;margin:0 auto;display:flex;align-items:center;gap:10px;border:none;border-radius:14px;padding:10px 14px;background:var(--card);box-shadow:0 4px 18px rgba(0,0,0,.14),0 0 0 .5px var(--sep);color:var(--label);text-align:left}
.wm b{display:block;font-size:15px;line-height:19px}
.wm #wmTxt{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.wm-go{color:#fff;background:var(--orange);border-radius:14px;padding:6px 12px;font-size:14px;font-weight:600}
body.wo-mini .wrap{padding-bottom:150px}
.tctl{display:flex;justify-content:center;gap:10px;margin:-6px 0 14px}
.tctl button{border:none;border-radius:16px;padding:7px 18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tctl .ps{background:var(--fill);color:var(--label)}
.tctl .stp{background:rgba(255,59,48,.14);color:var(--red)}
.tctl svg{width:12px;height:12px}
.cbtn::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid currentColor;opacity:.35}
.cbtn.gr{background:rgba(52,199,89,.2);color:var(--green)}
.cbtn.or{background:rgba(255,149,0,.2);color:var(--orange)}
.cbtn.bl{background:var(--tint-bg);color:var(--blue)}
.cbtn.gy{background:var(--fill);color:var(--label)}
.cbtn:disabled{opacity:.35}
.adj{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.adj button{border:none;background:var(--card);border-radius:18px;padding:7px 16px;font-size:15px;font-weight:500;color:var(--blue)}

.toast{position:fixed;left:50%;bottom:calc(49px + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,10px);z-index:60;background:var(--card2);color:var(--label);
  padding:10px 16px;border-radius:20px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}

@media (min-width:600px){ .wrap{padding:0 24px} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

const PGRP = {yogurt: ['yogurt', 'skyr'], formaggio: ['parmigiano', 'mozz_light', 'fiocchi'], latte: ['latte'],
  legumi: ['lenticchie', 'ceci', 'fagioli', 'piselli', 'edamame', 'lupini', 'pasta_lent', 'farina_ceci'],
  veg: ['tofu', 'tempeh', 'seitan', 'soia_text', 'yogurt_soia', 'latte_soia', 'uovo', 'albume']};
Object.entries(PGRP).forEach(([g, ks]) => ks.forEach(k => { const f = DIET.food[k]; if (f && !f[3]) f[3] = g; }));
function proteinOf(items){
  const g = {};
  (items || []).forEach(([k, q]) => { const f = DIET.food[k]; if (f && f[3]) g[f[3]] = (g[f[3]] || 0) + q * f[2] / 100; });
  // latte, yogurt e formaggi competono insieme come latticini; poi vince il più presente dei tre
  const D = ['yogurt', 'latte', 'formaggio'], t = Object.assign({}, g);
  if (D.some(k => g[k])){ t.dairy = D.reduce((a, k) => a + (g[k] || 0), 0); D.forEach(k => delete t[k]); }
  const best = Object.keys(t).sort((a, b) => t[b] - t[a])[0];
  if (best === 'dairy') return D.slice().sort((a, b) => (g[b] || 0) - (g[a] || 0))[0];
  return best || 'veg';
}
const protIcon = items => { const p = PROT[proteinOf(items)]; return `<span class="pi" role="img" aria-label="Proteina principale: ${p[0]}" title="${p[0]}">${p[1]}</span>`; };

/* ---------- archivio locale ---------- */
const Store = {
  key:'ilmiopiano-v2', data:{}, lazy:{},
  // archivi separati: le spunte e la seduta in corso non riscrivono le impostazioni a ogni tocco
  B: ['main', 'spunte', 'sessione'],
  bucket(k){ return /^(chk_|prep-)/.test(k) ? 'spunte' : k === 'wsession' ? 'sessione' : 'main'; },
  ls(b){ return b === 'main' ? this.key : this.key + '-' + b; },
  load(){
    this.data = {}; let mixed = false;
    for (const b of this.B){ try { const o = JSON.parse(localStorage.getItem(this.ls(b)) || '{}'); for (const k in o){ this.data[k] = o[k]; if (this.bucket(k) !== b) mixed = true; } } catch(e) {} }
    if (mixed) this.saveAll();
  },
  get(k, d){ return this.data[k] !== undefined ? this.data[k] : d; },
  set(k, v){ this.data[k] = v; this.save(this.bucket(k)); },
  setLazy(k, v){ this.data[k] = v; const b = this.bucket(k); clearTimeout(this.lazy[b]); this.lazy[b] = setTimeout(() => this.save(b), 450); },
  del(k){ if (k in this.data){ delete this.data[k]; this.save(this.bucket(k)); } },
  save(b){ const o = {}; for (const k in this.data) if (this.bucket(k) === b) o[k] = this.data[k]; try { localStorage.setItem(this.ls(b), JSON.stringify(o)); } catch(e) {} },
  saveAll(){ this.B.forEach(b => this.save(b)); },
  bytes(){ let n = 0; this.B.forEach(b => { n += (localStorage.getItem(this.ls(b)) || '').length * 2; }); return n; }
};
Store.load();

/* ---------- foto delle ricette (salvate sul dispositivo) ---------- */
const Photos = {
  map: {}, th: {}, size: {}, legacy: [], db: null,
  open(){ return new Promise(res => { try { const r = indexedDB.open('ilmiopiano-foto', 2);
    r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('foto')) db.createObjectStore('foto'); if (!db.objectStoreNames.contains('mini')) db.createObjectStore('mini'); };
    r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => res(null); } catch(e) { res(null); } }); },
  url(v){ return typeof v === 'string' ? v : URL.createObjectURL(v); },
  async load(){ const db = await this.open(); if (!db) return;
    const each = (store, fn) => new Promise(res => { const rq = db.transaction(store).objectStore(store).openCursor(); rq.onsuccess = () => { const c = rq.result; if (c){ fn(c.key, c.value); c.continue(); } else res(); }; rq.onerror = () => res(); });
    this.legacy = [];
    await each('foto', (k, v) => { this.map[k] = this.url(v); this.size[k] = typeof v === 'string' ? v.length : v.size; if (typeof v === 'string') this.legacy.push(k); });
    await each('mini', (k, v) => { this.th[k] = this.url(v); this.size['mini:' + k] = v.size || 0; }); },
  // accetta una foto come data URL (dal selettore o da un backup) e la salva come immagine 720 px + miniatura
  async put(k, src){
    let full = null, mini = null;
    try { const img = await loadImg(src); full = Math.max(img.width, img.height) <= PH_FULL && /^data:image\/jpeg/.test(src) ? await (await fetch(src)).blob() : await encodeImg(src, PH_FULL, PH_Q); mini = await encodeImg(src, PH_THUMB, .7); } catch(e) {}
    if (!full){ this.map[k] = src; return; }
    this.drop(k); this.map[k] = URL.createObjectURL(full); this.th[k] = URL.createObjectURL(mini || full); this.size[k] = full.size; this.size['mini:' + k] = mini ? mini.size : 0;
    this.legacy = this.legacy.filter(x => x !== k);

function prepLines(nx, ni, nwk, veg){

function rrect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

function drawBars(c, x, y, w, h, rows, color, fmtV, now){
  const n = rows.length, max = niceMax(Math.max(...rows.map(r => r.v)) * 1.08) || 1, base = y + h - 90, ph = h - 130, slot = w / n, bw = Math.min(64, slot * .45);

  rows.forEach((r, i) => { const bx = x + slot * i + (slot - bw) / 2, bh = r.v / max * ph;
    if (bh > 0){ c.globalAlpha = r.wk === now ? .45 : 1; c.fillStyle = color; const rad = Math.min(10, bh); c.beginPath(); c.moveTo(bx, base); c.lineTo(bx, base - bh + rad); c.quadraticCurveTo(bx, base - bh, bx + rad, base - bh); c.lineTo(bx + bw - rad, base - bh); c.quadraticCurveTo(bx + bw, base - bh, bx + bw, base - bh + rad); c.lineTo(bx + bw, base); c.closePath(); c.fill(); c.globalAlpha = 1; }
    c.fillStyle = '#8E8E93'; c.font = '500 26px -apple-system, "SF Pro Text", Helvetica, sans-serif'; c.textAlign = 'center'; c.fillText(weekDate(r.wk, 0).getDate() + '–' + weekDate(r.wk, 6).getDate(), x + slot * (i + .5), base + 34);
    c.fillStyle = '#1C1C1E'; c.font = '700 28px -apple-system, "SF Pro Text", Helvetica, sans-serif'; c.fillText(fmtV(r), x + slot * (i + .5), base + 70); });
  c.textAlign = 'left';
}

function weekItems(wk, phase, veg, withExtra, ignoreChoices){
  const r = settle(wk), tot = {}, add = its => its.forEach(([k, g]) => { tot[k] = (tot[k] || 0) + g; });
  DIET[phase].days.forEach((d, di) => d.meals.forEach((m, mi) => {
    if (m.mod){ if (withExtra) add(m.items); return; }
    add(resolve(m, ignoreChoices ? null : (r.ch[phase + '|' + di + '|' + mi] || null), veg).items);
  }));
  return tot;
}
function qtxt(k, g){
  if (!g) return '—';

  const ph = w.paused ? 'In pausa' : {ready: `Serie ${w.set} di ${c.N}`, work: `Serie ${w.set} di ${c.N} in corso`, rest: `Recupero, poi serie ${w.set + 1}`, finished: 'Esercizio completato'}[w.phase];
  const j = woNextInSet(w, c);
  const nx = w.phase === 'rest' ? 'Prepara il carico per la prossima serie' : (ss && w.phase !== 'finished' && j >= 0 ? 'Subito dopo: ' + c.g.ex[j].name : '');
  let Lb = '', Rb = '';
  if (w.phase === 'ready'){ Lb = `<button class="cbtn gy" disabled>Recupero</button>`; Rb = `<button class="cbtn gr" data-w="start">Inizia</button>`; }
  else if (w.phase === 'work'){ Lb = `<button class="cbtn gy" disabled>Recupero</button>`; Rb = `<button class="cbtn or" data-w="done">Fatto</button>`; }
  else if (w.phase === 'rest'){ Lb = `<button class="cbtn gy" data-w="skip">Salta</button>`; Rb = `<button class="cbtn gr" disabled>Inizia</button>`; }
  else { Lb = `<span style="width:84px"></span>`; Rb = `<button class="cbtn bl" data-w="next">${w.gi + 1 < nEx ? 'Avanti' : 'Fine'}</button>`; }
  const pauseSvg = '<svg viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="1.5" width="3" height="9" rx="1"/><rect x="7" y="1.5" width="3" height="9" rx="1"/></svg>', stopSvg = '<svg viewBox="0 0 12 12" fill="currentColor"><rect x="1.5" y="1.5" width="9" height="9" rx="2"/></svg>';
  const done = (L ? L.sets : []);
  $('#wo').innerHTML = `<div class="wo-top"><div class="wo-meta"><span class="wo-step">Esercizio ${w.gi + 1} di ${nEx}</span><span class="wo-el"><i class="rec"></i><span id="woElapsed">${hmm((Date.now() - w.start)/1000)}</span></span></div>
      <div class="wo-btns"><button class="cbtn2 or" data-w="min" aria-label="Metti in pausa e naviga nell'app">${pauseSvg}</button><button class="cbtn2 rd" data-w="close" aria-label="Termina e salva l'allenamento"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button></div></div>
    <div class="wo-in">
      <div class="wo-fig">${figHtml(e, 'woFig')}</div>
      ${ss ? `<div class="wo-ss">Superserie ${c.g.ex.map(x => x.num).join(' + ')}</div>` : ''}
      <h1 class="wo-name">${esc(e.name)}</h1>${e.muscles ? `<div class="wo-mu">${esc(e.muscles)}</div>` : ''}
      <div class="st4 wo-st"><div class="${wi.deload || wi.rientro ? 'mod' : ''}"><b>${c.sets[w.i]}</b><span>serie</span></div><div><b>${esc(e.reps)}</b><span>ripetizioni</span></div><div class="${wi.d || wi.deload || wi.rientro ? 'mod' : ''}"><b>${esc(adjRir(e, wi))}</b><span>RIR</span></div><div><b>${esc(e.rest)}</b><span>pausa</span></div></div>
      ${e.note ? `<div class="wo-note">${esc(e.note)}</div>` : ''}${sg ? `<div class="wo-sug">${sg}</div>` : ''}
      <div class="dial wo-dial"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--fill)" stroke-width="7"/><circle id="woRing" cx="60" cy="60" r="54" fill="none" stroke="var(--green)" stroke-width="7" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="339.29"/></svg>
        <div class="ctr"><div class="big" id="woBig">0:00</div><div class="ph">${ph}</div></div></div>
      <div class="dots">${Array.from({length: c.N}, (_, k) => `<i class="${k + 1 < w.set || w.phase === 'finished' ? 'd' : (k + 1 === w.set ? 'c' : '')}"></i>`).join('')}</div>
      <div class="nx">${esc(nx)}</div>
      ${w.phase === 'work' || w.phase === 'rest' ? `<div class="tctl"><button class="ps" data-w="${w.paused ? 'tresume' : 'tpause'}">${w.paused ? I.play.replace('<svg', '<svg width="12" height="12"') + 'Riprendi' : pauseSvg + 'Pausa'}</button><button class="stp" data-w="tstop">${stopSvg}Stop</button></div>` : ''}
      <div class="clock">${Lb}${Rb}</div>
      ${w.phase === 'rest' ? `<div class="adj"><button data-w="minus">−15 s</button><button data-w="plus">+15 s</button></div>` : ''}
      ${w.phase !== 'finished' ? `<div class="list"><label class="row frow"><span class="grow tt">Carico</span><input id="woLoad" class="fin" data-wex="${e.id}" value="${esc(df.l !== undefined ? df.l : (ld.c || ''))}" placeholder="${esc(loadInfo(e, wi).ph)}" autocomplete="off" inputmode="decimal"></label>
        <label class="row frow"><span class="grow tt">Ripetizioni fatte</span><input id="woReps" class="fin" data-wex="${e.id}" type="number" inputmode="numeric" min="0" max="99" value="${esc(df.r !== undefined ? df.r : repsGuess(e, L))}"></label></div>
        <div class="sec-f" style="margin:6px 4px 14px">Carico e ripetizioni vengono registrati quando tocchi «Fatto».</div>` : ''}
      ${done.length ? `<div class="sec"><div class="sec-h">Serie registrate<span class="r"><button class="lnkbtn" data-w="undo">Annulla l'ultima</button></span></div><div class="list">${done.map(x => `<div class="row"><span class="grow tt">Serie ${x.n}</span><span class="val">${x.load ? esc(x.load) + ' × ' : ''}${x.reps} rip.</span></div>`).join('')}</div></div>` : ''}
      <div class="wo-nav"><button class="btn tinted sm" data-w="prev" ${w.gi === 0 ? 'disabled' : ''}>‹ Precedente</button><button class="btn tinted sm" data-w="next">${w.gi + 1 < nEx ? 'Successivo ›' : 'Termina ›'}</button></div>
    </div>`;
  const f = $('#woFig'); if (f && f.tagName.toLowerCase() === 'svg') mountFig(f);
  woClock(w);
}
function askFinish(){ if (confirm('Terminare l\'allenamento? Carichi, ripetizioni e orari vengono salvati.')) finishWorkout(); }
function finishWorkout(silent){
  const w = W(); if (!w) return;
  const ex = Object.entries(w.log).map(([id, L]) => ({id, name: L.name, sets: L.sets})).filter(x => x.sets.length);
  const nSets = ex.reduce((a, x) => a + x.sets.length, 0);
  if (!nSets && !silent && !confirm('Non hai registrato nessuna serie. Chiudere senza salvare?')) return;
  if (nSets){
    const volume = ex.reduce((a, x) => a + x.sets.reduce((b, st) => b + (parseFloat(String(st.load).replace(',', '.')) || 0) * st.reps, 0), 0);
    const rec = {id: w.id, prog: w.prog, progName: w.progName, day: w.day, title: w.title, week: w.week, start: w.start, end: Date.now(), ex, nSets, volume: Math.round(volume)};
    const rows = rowsFromSession(rec); HIST.sedute = [rows.seduta].concat(HIST.sedute.filter(x => x.id !== rec.id)); HIST.serie = HIST.serie.filter(r => r.seduta !== rec.id).concat(rows.serie);
    histPut(rows.seduta, rows.serie).then(ok => { if (!ok){ const all = Store.get('sessions', []); all.unshift(rec); Store.set('sessions', all); } });
    if (!silent) toast(`Allenamento salvato · ${Math.round((rec.end - rec.start) / 60000)} min · ${nSets} serie`);
  } else if (!silent) toast('Allenamento chiuso');
  Store.set('wsession', null); clearInterval(tick);
  WO_OPEN = false; document.body.classList.remove('wo-on'); $('#wo').innerHTML = ''; try { wake && wake.release(); } catch(e) {} wake = null;
  renderMini(); if (!silent) render();
}
function renderMini(){
  const w = W(), m = $('#womini'); if (!m) return;
  if (!w || WO_OPEN){ m.hidden = true; document.body.classList.remove('wo-mini'); return; }
  m.hidden = false; document.body.classList.add('wo-mini');
  m.innerHTML = `<button class="wm" data-w="open"><i class="rec"></i><span class="grow"><b>${esc(w.title)}</b><span id="wmTxt"></span></span><span class="wm-go">Riprendi</span></button>`;
  miniClock(w);
}
function miniClock(w){ const t = $('#wmTxt'); if (!t) return; const rest = w.phase === 'rest' && !w.paused ? ' · recupero ' + mmss((w.end - Date.now()) / 1000) : ''; t.textContent = hmm((Date.now() - w.start) / 1000) + rest; }
document.addEventListener('input', ev => {
  const t = ev.target; if (t.id !== 'woLoad' && t.id !== 'woReps') return; const w = W(); if (!w) return;
  const d = (w.dft = w.dft || {}), k = t.dataset.wex; d[k] = Object.assign({}, d[k], {[t.id === 'woLoad' ? 'l' : 'r']: t.value}); Store.setLazy('wsession', w);
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-w]'); if (!b) return; const a = b.dataset.w;
  if (a === 'min') minimizeWorkout(); else if (a === 'open') openWorkout(); else if (a === 'close') askFinish(); else woAct(a);
});
/* ---------- storico ---------- */
function fmtDT(ts){ const d = new Date(ts); return ['dom','lun','mar','mer','gio','ven','sab'][d.getDay()] + ' ' + d.getDate() + ' ' + MESI[d.getMonth()] + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function histSum(s){ const r = histSets(s.id); return {n: r.length, vol: Math.round(r.reduce((a, x) => a + (x.kg || 0) * x.rip, 0))}; }
const hhmm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function renderHistory(){
  const all = HIST.sedute; if (!all.length) return '';
  return `<div class="sec" style="margin-top:28px"><div class="sec-h">Storico allenamenti<span class="r">${all.length}</span></div><div class="list">${all.slice(0, S.histAll ? 1e4 : 5).map(x => { const m = histSum(x);
    return `<button class="row" data-hist="${x.id}"><span class="grow"><span class="tt" style="display:block">${esc(x.titolo)} <span class="st">· ${esc(x.nomeScheda)}</span></span><span class="st" style="display:block">${fmtDT(x.inizio)} – ${hhmm(x.fine)} · ${Math.round((x.fine - x.inizio) / 60000)} min</span></span><span class="val">${m.n} serie</span>${I.chev}</button>`; }).join('')}
    ${all.length > 5 && !S.histAll ? `<button class="row" data-histall="1"><span class="grow tt link" style="text-align:center">Mostra tutti</span></button>` : ''}
    <button class="row ind" data-a="histcsv">${iconTile(I.share, 'green')}<span class="grow tt">Esporta lo storico (.csv)</span>${I.chev}</button></div>
    <div class="sec-f">Una riga per ogni serie: data, orari, scheda, esercizio, carico e ripetizioni. Si apre con Numbers, Excel o Fogli Google.</div></div>`;
}
function openHistory(id){
  const x = HIST.sedute.find(y => y.id === id); if (!x) return;
  const rows = histSets(id), m = histSum(x), by = [];
  rows.forEach(r => { let g = by.find(b => b.id === r.esercizio); if (!g) by.push(g = {id: r.esercizio, nome: r.nome, sets: []}); g.sets.push(r); });
  openSheet(x.titolo, `<p class="sec-f" style="margin:0 0 12px">${esc(x.nomeScheda)} · ${fmtDT(x.inizio)} – ${hhmm(x.fine)} · ${Math.round((x.fine - x.inizio) / 60000)} min · ${m.n} serie${m.vol ? ' · volume ' + nf(m.vol) + ' kg' : ''}</p>
    ${by.map(e => `<div class="sec"><div class="sec-h">${esc(e.nome)}</div><div class="list">${e.sets.map(st => `<div class="row"><span class="grow tt">Serie ${st.n}</span><span class="val">${st.carico ? esc(st.carico) + ' × ' : ''}${st.rip} rip.</span></div>`).join('')}</div></div>`).join('')}
    <div class="list"><button class="row" data-histdel="${x.id}"><span class="grow tt destr" style="text-align:center">Elimina dallo storico</span></button></div>`, 'Chiudi');
}

/* ---------- avvio ---------- */
renderTabbar();
setTimeout(() => { if (W()){ renderMini(); ensureTick(); } }, 0);
document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hidden', s.dataset.scr !== S.tab));
render(false);
cleanOld(); ledgerBackfill();
Promise.all([Photos.load(), histLoad()]).then(() => { buysBackfill(); render(); if (Photos.legacy.length || Store.get('sessions', []).length) setTimeout(askMigration, 600); });
setInterval(() => { if ((S.tab === 'spesa' || S.tab === 'menu') && !$('#sheet').classList.contains('on')) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#sheet').classList.contains('on')) render(); });
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
